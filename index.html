  }
  function ago(ts) {
    var t = new Date(ts).getTime();
    if (isNaN(t)) return '';
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'now';
    if (m < 60) return m + 'm';
    if (m < 60 * 24) return Math.round(m / 60) + 'h';
    var d = Math.round(m / 1440);
    if (d === 1) return 'Yesterday';
    if (d < 7) return d + 'd';

  function cellOf(w, pid) { return w.cells.filter(function (x) { return x.pid === pid; })[0] || null; }

  function toast(msg, isErr, ms) {

  }

  }
  var IC = {

    msg: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>',
    trophy: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',

    feed: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/></svg>',

    me: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
    back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>'
  };

  // ---------- server ----------
  function api(action, data, quiet) {

        if (!quiet) setBusy(false);

          if (j.error === 'bad_key') { KEY = ''; lsSet('bcd_key', ''); renderKeyScreen('That code was not recognized.'); return null; }
          toast(j.error || 'Something went wrong.', true); return null;
        }
        if (j.state) { S = j.state; lsSet('bcd_state', JSON.stringify(S)); }
        if (j.profile) ui.profiles[j.profile.pid] = j.profile;
        var news = (j.badgeNews || []).map(function (n) { return n.type === 'badge_gain' ? n.title.replace(/^.*? earned /, 'You earned ') : n.title.replace(/^.*? lost /, 'You lost '); });
        if (news.length) toast(news.join(' \u00b7 '), false, 6000);
        else if (j.message) toast(j.message);
        return j;
      })
      .catch(function () { if (!quiet) { setBusy(false); toast('Could not reach the tracker. Check your connection.', true); } return null; });
  }
  function setBusy(b) { ui.busy = b; document.getElementById('refreshBtn').className = 'pill' + (b ? ' spin' : ''); document.getElementById('syncBtn').className = 'pill' + (b ? ' spin' : ''); }

  function refresh(quiet) {

      '<button class="pill" data-a="toggleC" data-id="' + esc(it.id) + '">' + IC.msg + '<span>' + (n === 0 ? 'Comment' : n + (n === 1 ? ' comment' : ' comments')) + '</span></button>' +
      '<span style="margin-left:auto;display:flex;gap:14px">' +
      (it.canEdit ? '<button class="link" style="color:var(--dim)" data-a="editW" data-id="' + esc(it.id) + '">' + (it.canEdit === 'note' ? (it.note ? 'Edit note' : 'Add note') : 'Edit') + '</button>' : '') +
      (it.canDelete ? '<button class="link" style="color:var(--dim)" data-a="delW" data-id="' + esc(it.id) + '">Delete</button>' : '') + '</span></div>';
    if (ui.open[it.id]) {
      h += '<div class="cm">' + it.comments.map(function (c) { return '<div>' + nameBtn(c.pid) + ' <span style="color:var(--mid)">' + esc(c.text) + '</span><span class="ct">' + esc(ago(c.ts)) + '</span></div>'; }).join('') +

    return h;
  }
  function eventCard(it) {
    var icon = { inmoney: IC.trophy, buying: IC.coin, dormie: IC.flag, nudge: IC.clock, recap: IC.trophy, settle: IC.coin, payment: IC.coin, wall: IC.msg, badge_gain: IC.medal, badge_loss: IC.medal }[it.type] || IC.clock;
    var title = it.pid ? '<button class="nm" style="font-weight:800" data-a="profile" data-id="' + esc(it.type === 'wall' && it.toPid ? it.toPid : it.pid) + '">' + esc(it.title) + '</button>' : esc(it.title);
    return '<article class="col" style="gap:8px" id="p-' + esc(it.id) + '"><div class="ev ' + esc(it.type) + '"><span class="ic">' + icon + '</span><div class="col grow">' +
      '<h3>' + (it.type === 'dormie' ? '<span class="dtag">DORMIE</span>' : '') + title + '</h3><p>' + esc(it.body) + '</p>' +
      '<span class="sub" style="font-size:12px">' + esc(ago(it.ts)) + (it.badgeId ? ' \u00b7 <button class="link" style="font-size:12px" data-a="badge" data-id="' + esc(it.badgeId) + '">See the badge</button>' : '') + '</span>' + actions(it) + '</div></div></article>';
  }
  function workoutCard(it) {
    var badge = it.source === 'whoop' ? '<span class="tag">WHOOP</span>' : (it.source === 'sms' ? '<span class="tag">TEXT</span>' : '<span class="tag lime">LOGGED</span>');
    var second = it.source === 'whoop' ? ['Strain', it.strain === null ? '--' : it.strain.toFixed(1)] : ['Effort', it.effort || '--'];
    return '<article class="card col" style="gap:14px" id="p-' + esc(it.id) + '"><div class="row">' + avatar(it.pid) +
      '<div class="col grow" style="gap:1px">' + nameBtn(it.pid) + '<span class="sub" style="font-size:12px">' + esc(nice(it.activity || 'Workout')) + '   ' + esc(ago(it.ts)) + (it.editedAt ? '   edited ' + esc(ago(it.editedAt)) : '') + '</span></div>' + badge + '</div>' +
      (it.minutes === null ? '<p style="color:var(--soft)">' + (it.source === 'sms' ? 'Texted in a workout.' : 'Logged a workout.') + ' Week: ' + weekCount(it.pid) + '/' + S.rules.minDays + '</p>' :
      '<div class="stats"><div class="stat"><span>Time</span><b>' + it.minutes + 'm</b></div>' +
      '<div class="stat"><span>' + second[0] + '</span><b style="color:var(--lime)">' + esc(second[1]) + '</b></div>' +
      '<div class="stat"><span>Week</span><b>' + weekCount(it.pid) + '/' + S.rules.minDays + '</b></div></div>') +
      (it.note ? '<p style="color:var(--soft)">' + esc(it.note) + '</p>' : '') +

      actions(it) + '</article>';
  }
  function cards(items) { return items.map(function (it) { return it.kind === 'w' ? workoutCard(it) : eventCard(it); }).join(''); }

  // ---------- tabs ----------
  function myWeekCard() {
    var w = S.matrix[S.week.current - 1]; if (!w) return '';
    var c = cellOf(w, S.me.pid); if (!c) return '';
    var dots = ''; for (var i = 0; i < S.rules.minDays; i++) dots += '<span class="dot' + (i < c.count ? ' f' : '') + '"></span>';
    var text = { complete: 'Done   you are in the money', eligible: c.count + ' of ' + S.rules.minDays + ' done   ' + c.needed + ' to go', dormie: 'DORMIE   work out every day left', eliminated: 'Buying the bet this week (' + money(c.fine || 0) + ')', exempt: 'Week off', inactive: 'Inactive' }[c.status];
    return '<section class="card row between"><div class="col"><span class="sub">Your week</span><b>' + esc(text) + '</b></div><div class="dots" role="img" aria-label="' + c.count + ' of ' + S.rules.minDays + '">' + dots + '</div></section>';
  }
  function viewFeed() {
    var h = '';
    if (S.me.whoop === 'reconnect') h += '<div class="banner">Your WHOOP got disconnected. Your past workouts are safe. <button class="link" data-a="connect">Reconnect WHOOP</button></div>';
    h += '<div class="row" style="flex-wrap:wrap">' + ['all', 'workouts', 'callouts', 'badges'].map(function (f) { return '<button class="pill' + (ui.filter === f ? ' on' : '') + '" data-a="filter" data-id="' + f + '">' + nice(f) + '</button>'; }).join('') + '</div>';

    if (!items.length) h += '<div class="empty">Nothing here yet. Log a workout to get it started.</div>';

  }

  // Every badge and who holds it. withNews adds the recent "earned / lost" list on top.
  function badgeBoard(withNews) {
    var badges = S.badges || [], h = '';
    if (withNews) {
      var news = S.feed.filter(function (it) { return it.kind === 'e' && (it.type === 'badge_gain' || it.type === 'badge_loss'); }).slice(0, 12);
      h += '<h2 class="h">Recently</h2>';
      h += news.length ? '<div class="list">' + news.map(function (n) {
        return '<div><span style="color:' + (n.type === 'badge_gain' ? 'var(--gold)' : 'var(--dim)') + ';display:flex">' + IC.medal + '</span><button class="nm grow" style="font-weight:600" data-a="badge" data-id="' + esc(n.badgeId) + '" data-pid="' + esc(n.pid) + '">' + esc(n.title) + '</button><span class="sub">' + esc(ago(n.ts)) + '</span></div>';
      }).join('') + '</div>' : '<p class="sub">No badges have changed hands yet. New ones post here and in the feed.</p>';
      h += '<h2 class="h" style="margin-top:8px">All badges</h2>';
    }
    function group(kind, label) {
      var list = badges.filter(function (b) { return b.kind === kind; });
      if (!list.length) return '';
      return '<span class="lab">' + label + '</span><div class="list">' + list.map(function (b) {
        return '<div style="align-items:flex-start"><button class="bdg' + (b.holders.length ? ' got ' + b.kind : '') + '" style="min-height:44px;width:44px;flex:none;padding:0" data-a="badge" data-id="' + esc(b.id) + '" aria-label="' + esc(b.name) + '">' + badgeIcon(b) + '</button>' +
          '<div class="col grow" style="gap:2px"><button class="nm" data-a="badge" data-id="' + esc(b.id) + '">' + esc(b.name) + '</button><span class="sub" style="font-size:12px">' + esc(b.desc) + '</span>' +

    }
    return h + group('title', 'Titles   change hands') + group('milestone', 'Milestones');

  var ST_LABEL = { complete: 'DONE', eligible: 'ON TRACK', dormie: 'DORMIE', eliminated: 'BUYING', exempt: 'OFF', inactive: 'OUT' };
  function viewTracker() {
    if (S.week.current < 1) return '<div class="empty">The challenge has not started yet.</div>';
    var cur = S.matrix[S.week.current - 1];
    var order = { eliminated: 0, dormie: 1, eligible: 2, complete: 3, exempt: 4, inactive: 5 };
    var rows = cur.cells.filter(function (c) { return c.status !== 'inactive'; }).sort(function (a, b) { return order[a.status] - order[b.status] || person(a.pid).localeCompare(person(b.pid)); });
    var h = '<h2 class="h">This week</h2><div class="list">' + rows.map(function (c) {
      var dots = ''; for (var i = 0; i < S.rules.minDays; i++) dots += '<span class="dot' + (i < c.count ? ' f' : '') + '"></span>';
      return '<div><span class="grow">' + nameBtn(c.pid) + '</span><span class="dots">' + dots + '</span><span class="st ' + c.status + '">' + ST_LABEL[c.status] + '</span></div>';
    }).join('') + '</div>';
    var ppl = S.people.filter(function (p) { return p.active; });
    h += '<h2 class="h" style="margin-top:8px">Season</h2><p class="sub">Tap a week for the day-by-day view.</p><div class="tw"><table><thead><tr><th>Week</th>' +
      ppl.map(function (p) { return '<th>' + esc(p.name) + '</th>'; }).join('') + '<th>Pot</th></tr></thead><tbody>';
    S.matrix.slice().reverse().forEach(function (w) {
      h += '<tr data-a="week" data-id="' + w.week + '"><td class="wk">Wk ' + w.week + ' <span class="sub" style="font-weight:400">' + esc(w.label.replace(/^Week \d+ /, '')) + '</span></td>';
      ppl.forEach(function (p) { var c = cellOf(w, p.pid) || { count: '', status: '' }; h += '<td class="' + c.status + '">' + c.count + '</td>'; });
      h += '<td>' + (w.betTotal ? money(w.betTotal) : '') + '</td></tr>';
    });
    h += '</tbody></table></div><p class="sub">Rules: ' + S.rules.minDays + ' workouts a week, each ' + S.rules.minTime + '+ min' + ' (WHOOP workouts also need strain ' + S.rules.minEffort + '+). Miss a week: ' + money(S.rules.baseBet) + ', doubling each week in a row.</p>';
    h += '<h2 class="h" style="margin-top:8px">Badges</h2><p class="sub">Who holds what. Tap a badge or a name for more.</p>' + badgeBoard(false);
    return h;
  }

  function viewBets() {
    var b = S.bank, h = '';
    var me = b.accounts.filter(function (a) { return a.pid === S.me.pid; })[0] || { won: 0, fines: 0, paid: 0, balance: 0 };
    if (!b.pots.length) h += '<div class="card"><b>No pots yet</b><p class="sub">A pot shows up here each Monday, funded by the fines from the week that just ended. Tracking starts with week ' + b.startWeek + '.</p></div>';

      var names = p.members.map(person).join(', ') || 'Nobody was in the money';
      if (!p.settled) {
        h += '<article class="card col" style="gap:14px;border-color:var(--lime)"><div class="row between"><div class="col" style="gap:1px"><b>' + esc(p.label) + '</b><span class="sub">Betting ' + esc(p.betDates) + '</span></div><span class="tag lime">LIVE</span></div>' +

        h += '<article class="card col" style="gap:10px"><div class="row between"><div class="col" style="gap:1px"><b>' + esc(p.label) + '</b><span class="sub">Bet ' + esc(p.betDates) + '</span></div><span class="tag">SETTLED</span></div>' +
          '<div class="row"><b class="sub" style="font-size:20px">' + money(p.start) + '</b><span class="sub">?</span><b style="font-size:24px" class="' + (p.end >= p.start ? 'pos' : 'neg') + '">' + money(p.end) + '</b><b style="margin-left:auto">' + money(p.each) + ' each</b></div>' +

            : '<button class="link" style="text-align:left" data-a="toggleC" data-id="pot' + p.week + '">Still rolling? Update the total</button>') + '</article>';
      }
    });

    var owed = me.balance < 0 ? -me.balance : 0;
    h += '<h2 class="h" style="margin-top:8px">Your account</h2><section class="card col" style="gap:14px"><div class="row between"><b>' + esc(S.me.name) + '</b><b style="font-size:26px" class="' + (me.balance < 0 ? 'neg' : (me.balance > 0 ? 'pos' : '')) + '">' + money(me.balance) + '</b></div>' +
      '<div class="stats"><div class="stat"><span>Won</span><b class="pos">' + money(me.won) + '</b></div><div class="stat"><span>Fines</span><b class="neg">' + money(me.fines) + '</b></div><div class="stat"><span>Paid</span><b>' + money(me.paid) + '</b></div></div>' +
      (ui.open.pay ? '<label class="lab" for="payAmt">Amount you paid ' + esc(b.bankName) + '</label><div class="field"><b class="sub" style="font-size:20px">$</b><input id="payAmt" type="number" inputmode="decimal" min="0" value="' + (owed || '') + '"></div>' +
        '<div class="row"><button class="btn ghost" data-a="toggleC" data-id="pay">Cancel</button><button class="btn" data-a="pay">Log payment</button></div>'
        : '<button class="btn" data-a="toggleC" data-id="pay">Log a payment</button>') +
      (ui.lastPaid ? '<div class="banner" style="background:#232A12;border-color:#4B5A1C;color:#E4F5B8">The group can see your payment. Now send ' + money(ui.lastPaid) + ' to ' + esc(b.bankName) + ' separately (Venmo, etc.).</div>' : '') + '</section>';

    h += '<div class="row between" style="margin-top:8px"><h2 class="h">Everyone\'s balance</h2><span class="sub">Won ? fines + paid</span></div><div class="list">' +
      b.accounts.map(function (a, i) {
        return '<div><span class="sub" style="width:20px">' + (i + 1) + '</span><div class="col grow" style="gap:1px">' + nameBtn(a.pid) + '<span class="sub" style="font-size:12px">Won ' + money(a.won) + '   Fines ' + money(a.fines) + '   Paid ' + money(a.paid) + '</span></div>' +
          '<div class="col" style="align-items:flex-end;gap:0"><b class="num ' + (a.balance < 0 ? 'neg' : (a.balance > 0 ? 'pos' : '')) + '" style="font-size:17px">' + money(a.balance) + '</b>' + (a.balance < 0 ? '<span class="neg" style="font-size:11px;font-weight:800">OWES</span>' : '') + '</div></div>';
      }).join('') + '</div>';

    }).join('') + '</div>' : '<p class="sub">Every settle and payment will be listed here with who did it.</p>';

  // ---------- sheets (full-screen pages) ----------
  function sheetWrap(title, body, footer) {
    return '<div class="sheet" role="dialog" aria-modal="true"><header><button class="x" data-a="closeSheet" aria-label="Back">' + IC.back + '</button><h2 style="font-size:19px">' + esc(title) + '</h2></header><div class="body" id="sheetBody">' + body + '</div>' + (footer ? '<footer>' + footer + '</footer>' : '') + '</div>';
  }
  function weekSheet(wk) {
    var w = S.matrix[wk - 1]; if (!w) return '';
    var ppl = S.people.filter(function (p) { return p.active; });
    var h = '<div class="tw"><table><thead><tr><th>Day</th>' + ppl.map(function (p) { return '<th>' + esc(p.name) + '</th>'; }).join('') + '</tr></thead><tbody>';
    var start = dayNum(w.start), today = dayNum(S.week.today);
    for (var i = 0; i < 7; i++) {
      var iso = new Date((start + i) * 86400000).toISOString().substring(0, 10);
      h += '<tr><td>' + dayLabel(iso) + '</td>';
      ppl.forEach(function (p) {
        var hit = S.credits[p.pid] && S.credits[p.pid][iso];
        var cell = cellOf(w, p.pid) || {};
        var off = cell.status === 'exempt';
        h += '<td' + (off ? ' class="exempt"' : '') + ' title="' + esc(hit ? hit.join(', ') : '') + '">' + (hit ? '<b class="pos">?</b>' : (start + i > today || off ? '' : '<span class="neg">?</span>')) + '</td>';
      });
      h += '</tr>';
    }
    h += '</tbody></table></div>';
    h += '<div class="card col"><span class="sub">In the money</span><div>' + (w.inMoney.length ? nameList(w.inMoney) : (w.isCurrent ? 'Nobody yet' : 'Nobody')) + '</div></div>';
    h += '<div class="card col"><span class="sub">Buying the bet</span><div>' + (w.buying.map(function (b) { return nameBtn(b.pid, ' (' + money(b.amount) + ')'); }).join(', ') || 'Nobody') + '</div></div>';
    return sheetWrap(w.label, h, '');
  }

  function myDayItems(iso) {
    return S.feed.filter(function (f) { return f.kind === 'w' && f.pid === S.me.pid && f.date === iso; });
  }
  function logSheet() {
    var L = ui.log;
    var editing = !!L.editId;
    var days = S.week.days.filter(function (d) { return !d.future; });
    if (!editing && (!L.date || !days.some(function (d) { return d.iso === L.date; }))) L.date = S.week.today;
    function opts(key, list) { return '<div class="opts">' + list.map(function (o) { var id = o.id || o, label = o.label || o; return '<button class="opt' + (L[key] === id ? ' on' : '') + '" data-a="set" data-k="' + key + '" data-id="' + esc(id) + '" aria-pressed="' + (L[key] === id) + '">' + esc(label) + '</button>'; }).join('') + '</div>'; }
    var ok = L.minutes >= S.rules.minTime;
    var noteBox = '<div class="col" style="gap:10px"><label class="lab" for="logNote">Note</label><textarea class="txt" id="logNote" rows="3" maxlength="500" placeholder="How did it go? Trash talk welcome.">' + esc(L.note || '') + '</textarea></div>';
    if (L.noteOnly) {
      return sheetWrap('Edit note', '<p class="sub">WHOOP supplies the time and strain, so only the note can be changed.</p>' + noteBox, '<button class="btn" data-a="submitLog">Save note</button>');
    }
    var body = '';
    var dup = editing ? [] : myDayItems(L.date);
    if (editing) {
      body += '<p class="sub">Editing your workout for ' + esc(dayLabel(L.date)) + '. It will be marked as edited.</p>';
    } else {
      body += '<div class="col" style="gap:10px"><span class="lab">Day</span>' + opts('date', days.map(function (d) { return { id: d.iso, label: d.today ? 'Today' : d.label }; })) + '</div>';
      if (dup.length) {
        var d0 = dup[0], isW = d0.source === 'whoop';
        body += '<div class="banner">You already have a ' + (isW ? 'WHOOP ' : (d0.source === 'sms' ? 'texted ' : 'logged ')) + esc(nice(d0.activity || 'workout').toLowerCase()) + ' on ' + esc(dayLabel(L.date)) + '. ' +
          (isW && d0.ok ? 'A second log for that day will be hidden in the feed, because WHOOP already covers it. ' : 'It only counts once toward your week. ') +
          '<button class="link" data-a="viewPost" data-id="' + esc(d0.id) + '">View it</button></div>';
      }
    }
    body += '<div class="col" style="gap:10px"><span class="lab">What did you do?</span>' + opts('type', TYPES) + '</div>' +
      '<div class="col" style="gap:10px"><span class="lab">How long?</span><div class="card row between" style="padding:10px"><button class="step" data-a="mins" data-id="-5" aria-label="5 minutes less">?</button><div><b style="font-size:34px">' + L.minutes + '</b> <span class="sub">min</span></div><button class="step" data-a="mins" data-id="5" aria-label="5 minutes more">+</button></div>' +
      '<span style="font-size:13px" class="' + (ok ? 'pos' : 'neg') + '">' + (ok ? 'Counts toward your week' : 'Needs ' + S.rules.minTime + ' min to count') + '</span></div>' +
      '<div class="col" style="gap:10px"><span class="lab">Effort</span>' + opts('effort', ['Easy', 'Moderate', 'Hard']) + '</div>' + noteBox;
    return sheetWrap(editing ? 'Edit workout' : 'Log a workout', body, '<button class="btn" data-a="submitLog">' + (editing ? 'Save changes' : (dup.length ? 'Post anyway' : 'Post to the feed')) + '</button>');
  }

  function badgeIcon(b) { return b.kind === 'title' ? IC.trophy : IC.medal; }
  function holds(b, pid) { return b.holders.filter(function (x) { return x.pid === pid; })[0] || null; }
  function profileSheet(pid) {
    var p = who(pid); if (!p) return sheetWrap('Profile', '<div class="empty">Not found.</div>', '');
    var st = (S.stats || {})[pid] || { total: 0, complete: 0, played: 0, streak: 0, longest: 0, fines: 0 };
    var acct = S.bank.accounts.filter(function (a) { return a.pid === pid; })[0];
    var bal = acct ? acct.balance : 0;
    var wLabel = { connected: 'WHOOP connected', reconnect: 'WHOOP disconnected', none: 'No WHOOP' }[p.whoop] || '';
    var h = '<section class="card row">' + avatar(pid, true) + '<div class="col grow" style="gap:1px"><b style="font-size:20px">' + esc(p.name) + (pid === S.me.pid ? ' (you)' : '') + '</b><span class="sub">' + esc(wLabel) + '</span></div>' +
      '<div class="col" style="align-items:flex-end;gap:0"><span class="sub">Balance</span><b class="num ' + (bal < 0 ? 'neg' : (bal > 0 ? 'pos' : '')) + '" style="font-size:20px">' + money(bal) + '</b></div></section>';

    h += '<div class="stats"><div class="stat"><span>Workouts</span><b>' + st.total + '</b></div><div class="stat"><span>Weeks made</span><b>' + st.complete + '/' + st.played + '</b></div><div class="stat"><span>Fines</span><b class="' + (st.fines ? 'neg' : '') + '">' + money(st.fines) + '</b></div>' +
      '<div class="stat"><span>Streak</span><b>' + st.streak + ' wk</b></div><div class="stat"><span>Best streak</span><b>' + st.longest + ' wk</b></div><div class="stat"><span>This week</span><b>' + weekCount(pid) + '/' + S.rules.minDays + '</b></div></div>';

    h += '<div class="col" style="gap:8px"><span class="lab">Season, week by week</span><div class="strip">' + S.matrix.map(function (w) {
      var c = cellOf(w, pid) || { status: '' };
      return '<span class="sq ' + c.status + '" title="' + esc(w.label + ': ' + (ST_LABEL[c.status] || '')) + '">' + w.week + '</span>';
    }).join('') + '</div></div>';

    // challenges
    var ch = S.challenges, lines = [];
    var sIdx = -1; ch.strain.season.forEach(function (r, i) { if (r.pid === pid) sIdx = i; });
    if ((ch.strain.members || []).indexOf(pid) !== -1) {
      var tw = ch.strain.thisWeek.filter(function (r) { return r.pid === pid; })[0];
      lines.push('<div><span class="grow"><b>Weekly Strain</b><br><span class="sub">' + (sIdx >= 0 ? 'Season ' + ch.strain.season[sIdx].total.toFixed(1) + '   #' + (sIdx + 1) + ' of ' + ch.strain.season.length : 'No strain recorded yet') + '</span></span><b class="num pos">' + (tw ? tw.total.toFixed(1) : '0.0') + '</b></div>');
    }
    if ((ch.weight.members || []).indexOf(pid) !== -1) {
      var wr = ch.weight.board.filter(function (r) { return r.pid === pid; })[0];
      lines.push('<div><span class="grow"><b>Weight</b><br><span class="sub">' + (wr ? wr.weighIns + (wr.weighIns === 1 ? ' weigh-in' : ' weigh-ins') : 'No weigh-ins yet') + '</span></span><b class="num pos">' + (wr ? (wr.pct > 0 ? '+' : '') + wr.pct.toFixed(1) + '%' : '--') + '</b></div>');
    }
    h += '<div class="col" style="gap:8px"><span class="lab">Challenges</span>' + (lines.length ? '<div class="list">' + lines.join('') + '</div>' : '<p class="sub">Not in any challenges yet.</p>') + '</div>';

    // badges
    var badges = S.badges || [];
    var earned = badges.filter(function (b) { return holds(b, pid); }).length;
    h += '<div class="col" style="gap:8px"><span class="lab">Badges   ' + earned + ' of ' + badges.length + '</span><div class="bgrid">' + badges.map(function (b) {
      var got = !!holds(b, pid);
      return '<button class="bdg' + (got ? ' got ' + b.kind : '') + '" data-a="badge" data-id="' + esc(b.id) + '" data-pid="' + esc(pid) + '" aria-label="' + esc(b.name + (got ? ', earned' : ', not earned')) + '">' + badgeIcon(b) + '<span>' + esc(b.name) + '</span></button>';
    }).join('') + '</div></div>';

    // wall + feed
    var P = ui.profiles[pid];
    h += '<div class="col" style="gap:10px"><span class="lab">Wall</span><div class="row"><input class="txt" id="wallInput" maxlength="500" placeholder="Write on ' + esc(p.name) + '\'s wall" aria-label="Write on the wall"><button class="pill lime" data-a="wallPost" data-id="' + esc(pid) + '">Post</button></div>';
    if (P && P.wall.length) {
      h += '<div class="list">' + P.wall.map(function (c) {
        return '<div style="align-items:flex-start"><span class="grow">' + nameBtn(c.pid) + ' <span style="color:var(--mid)">' + esc(c.text) + '</span><span class="ct">' + esc(ago(c.ts)) + '</span></span>' + (c.mine ? '<button class="link" style="color:var(--dim)" data-a="wallDel" data-id="' + esc(c.id) + '">Delete</button>' : '') + '</div>';
      }).join('') + '</div>';
    } else if (P) h += '<p class="sub">Nothing on the wall yet.</p>';
    h += '</div>';

    h += '<span class="lab">Posts</span>';
    if (!P) h += '<div class="empty">Loading posts...</div>';
    else if (!P.items.length) h += '<div class="empty">No posts yet.</div>';
    else h += cards(P.items);
    return sheetWrap(p.name, h, '');
  }
  function badgeSheet(id, pid) {
    var b = (S.badges || []).filter(function (x) { return x.id === id; })[0];
    if (!b) return sheetWrap('Badge', '<div class="empty">Not found.</div>', '');
    var mine = pid ? holds(b, pid) : null;
    var h = '<section class="card col" style="gap:10px;align-items:center;text-align:center"><span class="bdg got ' + b.kind + '" style="width:96px">' + badgeIcon(b) + '</span><b style="font-size:20px">' + esc(b.name) + '</b>' +
      '<span class="tag">' + (b.kind === 'title' ? 'TITLE   CHANGES HANDS' : 'MILESTONE') + '</span><p style="color:var(--mid)">' + esc(b.desc) + '</p>' +
      (pid ? '<p class="' + (mine ? 'pos' : 'sub') + '" style="font-weight:700">' + esc(person(pid)) + (mine ? ' has this' + (mine.detail ? '   ' + esc(mine.detail) : '') : ' has not earned this yet') + '</p>' : '') + '</section>';
    h += '<span class="lab">' + (b.kind === 'title' ? 'Current holder' : 'Who has it') + '   ' + b.holders.length + '</span>';
    h += b.holders.length ? '<div class="list">' + b.holders.map(function (x) {
      return '<div>' + avatar(x.pid) + '<span class="grow">' + nameBtn(x.pid) + '</span><span class="sub">' + esc(x.detail) + '</span></div>';
    }).join('') + '</div>' : '<p class="sub">Nobody yet. It is up for grabs.</p>';
    return sheetWrap(b.name, h, '');
  }

  function renderSheet() {
    var el = document.getElementById('sheet');
    var t = top();
    if (!t) { el.innerHTML = ''; return; }
    var keep = document.getElementById('logNote'); if (keep && t.t === 'log') ui.log.note = keep.value;
    var body = document.getElementById('sheetBody');
    var y = body && el.getAttribute('data-key') === sheetKey(t) ? body.scrollTop : 0;
    el.innerHTML = t.t === 'log' ? logSheet() : t.t === 'week' ? weekSheet(t.week) : t.t === 'profile' ? profileSheet(t.pid) : badgeSheet(t.id, t.pid);
    el.setAttribute('data-key', sheetKey(t));
    if (y) document.getElementById('sheetBody').scrollTop = y;
  }
  function sheetKey(t) { return t.t + ':' + (t.pid || '') + ':' + (t.id || '') + ':' + (t.week || ''); }
  function pushSheet(t) {
    if (!ui.stack.length) ui.scrollY = window.scrollY;
    if (ui.stack.length > 12) ui.stack.shift();
    ui.stack.push(t);
    render();
  }

  // ---------- main render ----------
  var TABS = [['feed', 'Feed', IC.feed], ['tracker', 'Tracker', IC.grid], ['bets', 'Bets', IC.coin], ['challenges', 'Challenges', IC.trophy], ['me', 'Me', IC.me]];
  function render() {
    if (!S) return;
    document.getElementById('hdrSub').textContent = S.week.label;
    document.getElementById('hdrSync').textContent = S.lastSync ? 'WHOOP synced ' + (ago(S.lastSync) === 'now' ? 'just now' : ago(S.lastSync) + ' ago') : '';
    var nav = document.getElementById('tabs');
    nav.style.display = 'block';
    nav.firstElementChild.innerHTML = TABS.map(function (t) { return '<button class="' + (ui.tab === t[0] ? 'on' : '') + '" data-a="tab" data-id="' + t[0] + '"' + (ui.tab === t[0] ? ' aria-current="page"' : '') + '>' + t[2] + t[1] + '</button>'; }).join('');
    var open = ui.stack.length > 0;
    document.getElementById('fab').style.display = !open && (ui.tab === 'feed' || ui.tab === 'tracker') && S.week.current >= 1 ? 'flex' : 'none';
    // While a full-screen page is open the tab underneath is not drawn, so there is only ever one copy of each post on the page.
    view.innerHTML = open ? '' : { feed: viewFeed, tracker: viewTracker, bets: viewBets, challenges: viewChallenges, me: viewMe }[ui.tab]();
    renderSheet();
  }

  // ---------- actions ----------
  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function closeAll() { ui.stack = []; }
  var ACT = {
    refresh: function () { refresh(false); },
    syncNow: function () {
      var b = document.getElementById('syncBtn'); b.textContent = 'Syncing';
      api('syncNow', {}).then(function (j) { b.textContent = 'Sync'; if (j) render(); });
    },
    saveKey: function () { var v = val('keyInput'); if (!v) return; var m = v.match(/[?&]k=([^&\s]+)/); KEY = m ? m[1] : v; lsSet('bcd_key', KEY); start(); },
    tab: function (id) { ui.tab = id; ui.lastPaid = null; closeAll(); render(); window.scrollTo(0, 0); },
    filter: function (id) { ui.filter = id; render(); },
    toggleC: function (id) { ui.open[id] = !ui.open[id]; render(); var f = document.getElementById(id === 'pay' ? 'payAmt' : (id.indexOf('pot') === 0 ? 'pot-' + id.substring(3) : 'c-' + id)); if (f && ui.open[id]) f.focus(); },
    fire: function (id) {
      findItem(id).forEach(function (it) {                       // instant, then confirmed by the server
        it.fired = !it.fired;
        it.firedBy = (it.firedBy || []).filter(function (p) { return p !== S.me.pid; });
        if (it.fired) it.firedBy.push(S.me.pid);
        it.fires = it.firedBy.length;
      });
      render();
      api('react', { target: id }, true).then(function (j) { if (j && !typing()) render(); });
    },
    sendC: function (id) { var t = val('c-' + id); if (!t) return; api('comment', { target: id, text: t }).then(done); },
    delW: function (id) { if (!confirm('Delete this workout?')) return; api('deleteWorkout', { id: id }).then(done); },
    editW: function (id) {
      var it = findItem(id)[0]; if (!it) return;
      ui.log = { editId: id, noteOnly: it.canEdit === 'note', date: it.date, type: TYPES.indexOf(it.activity) !== -1 ? it.activity : 'Other', minutes: it.minutes || 30, effort: it.effort || 'Moderate', note: it.note || '' };
      pushSheet({ t: 'log' });
    },
    openLog: function () { ui.log = freshLog(); pushSheet({ t: 'log' }); },
    closeSheet: function () {
      ui.stack.pop();
      render();
      if (!ui.stack.length) window.scrollTo(0, ui.scrollY || 0);
    },
    week: function (id) { pushSheet({ t: 'week', week: parseInt(id, 10) }); },
    profile: function (pid) {
      if (!who(pid)) return;
      var t = top();
      if (t && t.t === 'profile' && t.pid === pid) return;
      pushSheet({ t: 'profile', pid: pid });
      api('profile', { pid: pid }, true).then(function (j) { if (j && !typing()) renderSheet(); });
    },
    badge: function (id, el) { pushSheet({ t: 'badge', id: id, pid: el.getAttribute('data-pid') || '' }); },
    wallPost: function (pid) { var t = val('wallInput'); if (!t) return; api('comment', { target: 'wall_' + pid, text: t }).then(done); },
    wallDel: function (id) { if (!confirm('Delete this comment?')) return; api('deleteComment', { id: id }).then(done); },
    viewPost: function (id) {
      closeAll(); ui.tab = 'feed'; ui.filter = 'all'; render();
      var el = document.getElementById('p-' + id);
      if (el) el.scrollIntoView({ block: 'center' }); else toast('That post is further back than the feed goes.');
    },
    set: function (id, el) { ui.log[el.getAttribute('data-k')] = id; renderSheet(); },
    mins: function (id) { ui.log.minutes = Math.max(5, Math.min(300, ui.log.minutes + parseInt(id, 10))); renderSheet(); },
    submitLog: function () {
      var L = ui.log; L.note = val('logNote');
      if (L.editId) {
        api('editWorkout', { id: L.editId, type: L.type, minutes: L.minutes, effort: L.effort, note: L.note }).then(function (j) {
          if (!j) return; ui.log = freshLog(); ACT.closeSheet();
        });
        return;
      }
      api('logWorkout', { date: L.date, type: L.type, minutes: L.minutes, effort: L.effort, note: L.note }).then(function (j) {
        if (!j) return; ui.log = freshLog(); closeAll(); ui.tab = 'feed'; render(); window.scrollTo(0, 0);
      });
    },
    settle: function (id) {
      var v = val('pot-' + id); if (v === '' || isNaN(parseFloat(v))) { toast('Enter the total first.', true); return; }
      api('settle', { week: id, amount: parseFloat(v) }).then(function (j) { if (j) { ui.open['pot' + id] = false; render(); } });
    },
    pay: function () {
      var v = parseFloat(val('payAmt')); if (isNaN(v) || v <= 0) { toast('Enter the amount you paid.', true); return; }
      api('payment', { amount: v }).then(function (j) { if (j) { ui.open.pay = false; ui.lastPaid = v; render(); } });
    },
    join: function (id) { api('join', { challenge: id }).then(done); },
    leave: function (id) { if (!confirm('Leave this challenge?')) return; api('leave', { challenge: id }).then(done); },
    weight: function () { var v = parseFloat(val('wt')); if (isNaN(v)) { toast('Enter your weight.', true); return; } api('weight', { weight: v }).then(done); },
    connect: function () { if (S.me.connectUrl) window.open(S.me.connectUrl, '_blank'); else toast('WHOOP connect is not set up yet.', true); }
  };
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-a]') : null;
    if (!el || ui.busy && el.getAttribute('data-a') !== 'closeSheet') return;
    var fn = ACT[el.getAttribute('data-a')];
    if (fn) fn(el.getAttribute('data-id'), el);
  });

  // ---------- pull down to refresh ----------
  // Home-screen apps on iPhone have no built-in pull to refresh, so this does it by hand.
  // Pulling reloads from the sheet (fast). The Sync button is what asks WHOOP for new workouts.
  (function () {
    var ptr = document.getElementById('ptr'), y0 = null, pull = 0, MAX = 120, GO = 64;
    function scroller() { return ui.stack.length ? document.getElementById('sheetBody') : null; }
    function atTop() { var sc = scroller(); return sc ? sc.scrollTop <= 0 : (window.scrollY || document.documentElement.scrollTop) <= 0; }
    function show(px, anim) { ptr.style.transition = anim ? 'transform .2s, opacity .2s' : 'none'; ptr.style.opacity = px > 6 ? Math.min(1, px / GO) : 0; ptr.style.transform = 'translateY(' + (px - 60) + 'px) rotate(' + (px * 3) + 'deg)'; }
    document.addEventListener('touchstart', function (e) {
      y0 = null; pull = 0;
      if (!KEY || !S || ui.busy || e.touches.length !== 1 || !atTop()) return;
      var t = top(); if (t && t.t === 'log') return;
      y0 = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchmove', function (e) {
      if (y0 === null) return;
      var d = e.touches[0].clientY - y0;
      if (d <= 0 || !atTop()) { pull = 0; show(0); if (d < -10) y0 = null; return; }
      pull = Math.min(MAX, d * 0.5); show(pull);
    }, { passive: true });
    function end() {
      if (y0 === null) return;
      y0 = null;
      if (pull < GO) { show(0, true); return; }
      show(GO, true); ptr.className = 'go';
      var t = top();
      var p = t && t.t === 'profile' ? api('profile', { pid: t.pid }, true).then(function () { return api('state', {}, true); }) : api('state', {}, true);
      p.then(function (j) {
        ptr.className = ''; show(0, true);
        if (!j) { toast('Could not reach the tracker. Check your connection.', true); return; }
        if (!typing()) render();
      });
    }
    document.addEventListener('touchend', end); document.addEventListener('touchcancel', end);
  })();

  // ---------- start ----------
  function start() {
    if (!KEY) { renderKeyScreen(''); return; }
    var cached = lsGet('bcd_state');
    if (cached && !S) { try { S = JSON.parse(cached); if (!S.badges || !S.stats) S = null; else render(); } catch (e) { S = null; } }
    refresh(false);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && KEY && S) refresh(true); });
  setInterval(function () { if (!document.hidden && KEY && S && !ui.busy) refresh(true); }, 90000);
  start();
})();
</script>
</body>
</html>
