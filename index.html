<script>
// ================================================================
// BC Dads WAG - phone app  (version number: see version.js, bump it with every change)

// Apps Script web app address ending in /exec (same as Settings > redirect_url).
// ================================================================
var API_URL = 'https://script.google.com/macros/s/AKfycbx0_onfzr9j-zB3Hz9PWI-44Cpq6WqUrrbkX5whhMvhQAVcAXgoC4gRjNyKftjaQ1D1/exec';
</script>
<style>
:root{--bg:#0E1013;--card:#171A1F;--line:#262A31;--line2:#2E333B;--text:#F2F3F5;--soft:#DDE1E6;--mid:#C3C8D0;--dim:#9AA1AC;--lime:#C8F04B;--gold:#F5C451;--red:#FF8A80;--orange:#FFB86B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;touch-action:manipulation;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;font-size:15px;line-height:1.4}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
/* The page itself never scrolls; only the feed area (main) does. iPhone home-screen apps misplace fixed bars
   when the whole page scrolls and redraws, so the header, tab bar and + button sit outside the scrolling part. */
/* 100vh, not 100%: in iPhone home-screen apps 100% can come out shorter than the screen (by the status bar), which lifts the tab bar. */
html,body{height:100vh;overflow:hidden}
.app{max-width:560px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid #22262C;padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header.top h1{font-size:21px;font-weight:800;letter-spacing:-.3px}
.sub{font-size:13px;color:var(--dim)}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:14px 14px 170px;display:flex;flex-direction:column;gap:12px}
main>*{flex-shrink:0}
header.top{flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:4px}
.grow{flex:1;min-width:0}
.big{font-size:22px;font-weight:800}
.num{font-weight:800;font-variant-numeric:tabular-nums}
.pill{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--mid);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.pill.lime{background:var(--lime);color:var(--bg);border-color:var(--lime)}
.btn{min-height:50px;border-radius:999px;border:0;background:var(--lime);color:var(--bg);font-size:16px;font-weight:800;padding:0 20px;width:100%}
.btn.ghost{background:transparent;color:var(--soft);border:1px solid var(--line2)}
.btn:disabled{background:#22262C;color:#8A919C}
.tag{font-size:11px;font-weight:800;letter-spacing:.6px;padding:4px 8px;border-radius:6px;border:1px solid #3A4048;color:var(--mid);white-space:nowrap}
.tag.lime{background:#232A12;color:var(--lime);border-color:#232A12}
.av{width:40px;height:40px;border-radius:999px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none;border:0;padding:0}
.av.lg{width:56px;height:56px;font-size:19px}
.nm{background:none;border:0;padding:0;font:inherit;font-weight:700;color:inherit;text-align:left}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.stat b{font-size:19px;font-weight:800}
.ev{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px 16px;border:1px solid var(--line);background:var(--card)}
.ev .ic{width:36px;height:36px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#22262C;color:var(--mid)}
.ev h3{font-size:15px;font-weight:800}
.ev p{font-size:14px;color:var(--mid)}
.ev.inmoney{background:#241E0F;border-color:#5C4718}.ev.inmoney h3,.ev.inmoney .ic{color:var(--gold)}.ev.inmoney .ic{background:#3A2F12}
.ev.buying{background:#261414;border-color:#5E2626}.ev.buying h3,.ev.buying .ic{color:var(--red)}.ev.buying .ic{background:#3B1A1A}
.ev.dormie{background:#2A1C0E;border-color:#7A4A16}.ev.dormie h3,.ev.dormie .ic{color:var(--orange)}.ev.dormie .ic{background:#3D2810}
.ev.nudge{border-style:dashed;border-color:#4A505A}.ev.nudge .ic{background:#232A12;color:var(--lime)}
.ev.settle .ic,.ev.payment .ic{background:#232A12;color:var(--lime)}
.ev.badge_gain{background:#241E0F;border-color:#5C4718}.ev.badge_gain h3,.ev.badge_gain .ic{color:var(--gold)}.ev.badge_gain .ic{background:#3A2F12}
.ev.badge_loss .ic{color:var(--dim)}
.ev.bet{border-color:#4B5A1C}.ev.bet .ic,.ev.bet_result .ic{background:#232A12;color:var(--lime)}
.ev.bet_result{background:#241E0F;border-color:#5C4718}.ev.bet_result h3{color:var(--gold)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sd{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;min-height:64px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--text);font-size:13px}
button.sd{border-color:var(--lime)}
.sd.on{background:#232A12;border-color:var(--lime)}.sd.win{border-color:var(--gold)}.sd.off{opacity:.55}
.ev.tap{cursor:pointer}.openline{font-size:13px;font-weight:700;color:var(--gold)}
.vs{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center}.vs .mid{color:var(--dim);font-size:12px}.vs .w{color:var(--lime);font-weight:800}.vs .l{color:var(--dim)}
.sd b{font-size:15px}.sd i{font-style:normal;color:var(--dim);font-size:12px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card);width:100%;font-size:15px;font-weight:700;text-align:left}
.sw span.k{width:46px;height:28px;border-radius:999px;background:#3A4048;position:relative;flex:none}
.sw span.k:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:999px;background:#fff}
.sw.on span.k{background:var(--lime)}.sw.on span.k:after{left:21px;background:var(--bg)}
.opt:disabled{opacity:.35}
.dtag{font-size:11px;font-weight:900;letter-spacing:1px;padding:3px 7px;border-radius:6px;background:var(--orange);color:#2A1C0E;margin-right:8px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who{font-size:13px;color:var(--mid);display:flex;gap:6px;align-items:flex-start}
.who svg{flex:none;color:var(--lime);margin-top:1px}
.cm{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.cm>div{font-size:14px}
.tag.strava{color:#FC4C02;border-color:rgba(252,76,2,.45)}
.tag.peloton{color:#FF5A66;border-color:rgba(223,28,47,.55)}
.pbar{height:5px;border-radius:3px;background:#22262C;overflow:hidden}.pbar i{display:block;height:100%;background:var(--lime)}
.ct{font-size:12px;color:var(--dim);margin-left:6px;white-space:nowrap}
.cph{margin-top:6px;display:flex;gap:6px}.cph button{border:0;padding:0;background:#22262C;border-radius:10px;overflow:hidden;display:block;width:160px;max-width:60%}.cph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.field{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:0 14px;min-height:50px}
.field input{flex:1;min-width:0;border:0;background:transparent;font-size:18px;font-weight:700;outline:none}
input.txt,textarea.txt,select.txt{width:100%;color:var(--text,#fff);min-height:44px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);padding:10px 14px;font-size:16px;outline:none}
.dots{display:flex;gap:5px}.dot{width:13px;height:13px;border-radius:999px;border:2px solid #4A505A}.dot.f{background:var(--lime);border-color:var(--lime)}
.st{font-size:11px;font-weight:800;letter-spacing:.5px;padding:3px 8px;border-radius:6px}
.list .st{width:84px;text-align:center;flex:none;white-space:nowrap}.list .dots{flex:none}
#ptr{position:fixed;top:calc(env(safe-area-inset-top) + 74px);left:50%;z-index:6;width:38px;height:38px;margin-left:-19px;border-radius:999px;background:var(--card);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--lime);opacity:0;transform:translateY(-60px);pointer-events:none}
#ptr.go svg{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
html{overscroll-behavior-y:contain}
header.top .pill{padding:0 12px}
@media (prefers-reduced-motion:reduce){#ptr.go svg{animation:none}}
.st.complete{background:#1E3320;color:#9BE29F}.st.eligible{background:#33301B;color:#F3E08A}.st.dormie{background:#3D2810;color:var(--orange)}.st.eliminated{background:#3B1A1A;color:var(--red)}.st.exempt,.st.inactive{background:#2A2D33;color:var(--dim)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
th,td{padding:9px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
th{font-weight:700;color:var(--mid);background:var(--card)}
td:first-child,th:first-child{position:sticky;left:0;background:var(--card);text-align:left;z-index:1}
td.complete{background:#1E3320;color:#C9F2CB}td.eligible{background:#33301B;color:#F3E08A}td.dormie{background:#4A3013;color:#FFD9A8}td.eliminated{background:#451E1E;color:#FFC7C2}td.exempt,td.inactive{background:#24272C;color:#7C838E}
td.wk{color:var(--lime);font-weight:700}
.list>div{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #22262C}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.neg{color:var(--red)}.pos{color:var(--lime)}
.strip{display:flex;gap:5px;flex-wrap:wrap}
.sq{width:26px;height:26px;border-radius:7px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;background:#24272C;color:#7C838E}
.sq.complete{background:#1E3320;color:#9BE29F}.sq.eliminated{background:#451E1E;color:#FFC7C2}.sq.eligible{background:#33301B;color:#F3E08A}.sq.dormie{background:#4A3013;color:#FFD9A8}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bdg{min-height:74px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:#7C838E;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:700;text-align:center;line-height:1.2}
.bdg svg{opacity:.5}
.bdg.got{background:#232A12;border-color:#4B5A1C;color:var(--lime)}
.bdg.got.title{background:#241E0F;border-color:#5C4718;color:var(--gold)}
.bdg.got.weekly{background:#10222B;border-color:#1F4A5C;color:#7FD4F5}
.bdg.got svg{opacity:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;transform:translateZ(0);-webkit-backface-visibility:hidden;background:var(--bg);border-top:1px solid #22262C;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;color:var(--dim);height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700}
nav.tabs button.on{color:var(--lime)}
.fab{position:fixed;z-index:8;transform:translateZ(0);-webkit-backface-visibility:hidden;right:max(16px,calc(50% - 264px));bottom:calc(env(safe-area-inset-bottom) + 78px);width:58px;height:58px;padding:0;border-radius:999px;border:0;background:var(--lime);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.fab svg{transition:transform .22s ease}
.fabm{transform:translateZ(0)}.fabon .fab svg{transform:rotate(45deg)}
.fabbg{position:fixed;inset:0;z-index:7;background:rgba(8,9,11,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.fabon .fabbg{opacity:1;pointer-events:auto}
.fabm{position:fixed;z-index:8;right:max(16px,calc(50% - 264px));bottom:calc(env(safe-area-inset-bottom) + 146px);display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
.fabm button{min-height:48px;padding:0 18px 0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:15px;font-weight:800;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);
  opacity:0;transform:translateY(16px) scale(.96);transition:opacity .18s ease,transform .22s cubic-bezier(.2,.9,.3,1.2)}
.fabm button svg{color:var(--lime)}
.fabon .fabm{pointer-events:auto}.fabon .fabm button{opacity:1;transform:none}.fabon .fabm button:nth-child(3){transition-delay:.04s}.fabon .fabm button:nth-child(2){transition-delay:.08s}.fabon .fabm button:nth-child(1){transition-delay:.12s}
@media (prefers-reduced-motion:reduce){.fab svg,.fabm button,.fabbg{transition:none}}
.cmp{display:flex;gap:10px;align-items:center}.cmp img{width:84px;height:84px;object-fit:cover;border-radius:12px;display:block}
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.sheet header{padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #22262C}
.sheet .body{flex:1;overflow-y:auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
.sheet .body>*{flex-shrink:0}
.sheet footer{padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid #22262C}
.x{width:44px;height:44px;border-radius:999px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.lab{font-size:13px;font-weight:700;color:var(--dim)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--soft);font-size:14px;font-weight:700}
.opt.on{background:var(--lime);color:var(--bg);border-color:var(--lime)}
.step{width:50px;height:50px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);font-size:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 150px);z-index:20;background:#F2F3F5;color:#0E1013;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;max-width:90vw;text-align:center;display:none}
.toast.err{background:#7A271A;color:#fff}
.banner{background:#2A1C0E;border:1px solid #7A4A16;border-radius:14px;padding:12px 14px;font-size:14px;color:#EBD7BF}
.empty{color:var(--dim);text-align:center;padding:30px 10px}
.swp{position:relative;border-radius:16px;overflow:hidden}
.swp>.swa{position:absolute;right:0;top:0;bottom:0;display:flex;gap:6px;padding-left:6px;visibility:hidden}
.swp.drag>.swa,.swp.open>.swa{visibility:visible}
.swa button{border:0;border-radius:16px;width:80px;font-weight:800;font-size:14px;color:#0E1013;background:var(--orange)}
.swa button.del{background:var(--red)}
.swc{position:relative}
.av.live{box-shadow:0 0 0 2px var(--card),0 0 0 4px #3DD68C}
.av.idle{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--gold)}
/* Tracker: a thin rounded box around a name = green = in the app in the last 5 min, yellow = in the last 30 min */
.pbox{display:inline-block;margin-left:-9px;padding:3px 8px;border-radius:9px;border:1.5px solid transparent}.pbox.live{border-color:#3DD68C}.pbox.idle{border-color:var(--gold)}
.seen{display:inline-flex;align-items:center;gap:6px}.seen i{width:8px;height:8px;border-radius:999px;background:var(--dim)}.seen i.live{background:#3DD68C}.seen i.idle{background:var(--gold)}
.pill.rx{gap:6px;padding:0 12px}.pill.rx svg{flex:none}.pill.rx.on{background:transparent;border-color:var(--lime);color:var(--lime)}
.rpick{display:flex;gap:4px;padding:6px;border-radius:999px;background:#1E2228;border:1px solid var(--line2);width:max-content;max-width:100%;margin-top:8px}
.rpick button{width:54px;height:54px;border-radius:999px;border:0;background:transparent;color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;letter-spacing:.02em}
.rpick button.on{background:var(--lime);color:var(--bg)}
.men{color:var(--lime);font-weight:700}
.msugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.news h2{font-size:24px;margin-top:6px}.news .md p{margin:10px 0;color:var(--soft)}.news .md ul{margin:10px 0;padding-left:20px;color:var(--soft)}.news .md li{margin:4px 0}.news .md a{color:var(--lime)}
.phs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.phs.one{grid-template-columns:1fr}
.phs button{border:0;padding:0;background:#22262C;border-radius:12px;overflow:hidden;display:block}
.phs img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.phbig{width:100%;border-radius:14px;display:block;background:#22262C}
.tag.u-active{background:#13281D;color:#3DD68C;border-color:#13281D}.tag.u-lapsed{background:#2A2410;color:var(--gold);border-color:#2A2410}
.tag.u-texting{background:#2A1C0E;color:var(--orange);border-color:#7A4A16}.tag.u-never{background:#261414;color:var(--red);border-color:#261414}
.amenu>button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #22262C;padding:14px;color:inherit}
.amenu>button:last-child{border-bottom:0}.amenu svg{flex:none;color:var(--dim)}
.owe{position:sticky;top:8px;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#2A1C0E;border:1px solid #7A4A16;color:#F3E2CC;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.owe b{font-size:16px}.owe .sub{color:#D9BF9D;font-size:13px}
.zb{display:flex;gap:2px;height:8px;border-radius:999px;overflow:hidden}.zb i{display:block;height:100%;min-width:3px}
.zb .z1{background:#4A505A}.zb .z2{background:#6F9BC9}.zb .z3{background:var(--lime)}.zb .z4{background:var(--orange)}.zb .z5{background:var(--red)}
.wdet{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mid)}.wdet b{color:var(--text)}
.link{color:var(--lime);background:none;border:0;padding:0;font-weight:700;font-size:14px}
.spin{opacity:.5}
h2.h{font-size:18px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="col" style="gap:1px"><h1>BC Dads WAG</h1><span class="sub" id="hdrSub">Loading...</span><span class="sub" id="hdrSync" style="font-size:12px"></span></div>
    <div class="row" style="gap:8px;flex:none"><button class="pill" id="syncBtn" data-a="syncNow" aria-label="Sync WHOOP now">Sync</button><button class="pill" id="refreshBtn" data-a="refresh" aria-label="Refresh">Refresh</button></div>
  </header>
  <div id="ptr" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></div>
  <main id="view"><div class="empty">Loading...</div></main>
</div>
<div class="fabbg" data-a="fabClose"></div>
<div class="fabm" id="fabMenu" aria-hidden="true">

  <button data-a="openPost"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Post</button>

<nav class="tabs" id="tabs" style="display:none"><div></div></nav>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ---------- storage + key ----------
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var urlKey = (new URLSearchParams(location.search).get('k') || '').trim();
  var KEY = urlKey || lsGet('bcd_key') || '';
  if (urlKey) lsSet('bcd_key', urlKey);
  // The key stays in the address on purpose: "Add to Home Screen" saves the address, key included.

  var TYPES = ['Run', 'Strength', 'Bike', 'Walk', 'Golf', 'Swim', 'Sports', 'Other'];
  function freshLog() { return { date: '', type: 'Strength', minutes: 40, effort: 'Hard', note: '', editId: '', noteOnly: false, forPid: '', earlier: false }; }

  var S = null;                       // latest state from the server
  var ui = { fb: '', pick: null, news: [], newsDone: false, tab: 'feed', filter: 'all', open: {}, stack: [], busy: false, lastPaid: null, profiles: {}, scrollY: 0, log: freshLog(), bet: null, betPick: null };
  var view = document.getElementById('view');
  function top() { return ui.stack[ui.stack.length - 1] || null; }

  // ---------- helpers ----------
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function who(pid) { return (S.people || []).filter(function (x) { return x.pid === pid; })[0] || null; }
  function person(pid) { var p = who(pid); return p ? p.name : 'Someone'; }
  function nameBtn(pid, extra) { return '<button class="nm" data-a="profile" data-id="' + esc(pid) + '">' + esc(person(pid)) + (extra || '') + '</button>'; }
  function nameList(pids) {
    var n = pids.map(function (p) { return nameBtn(p); });
    if (n.length <= 1) return n.join('');
    return n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1];
  }
  // Reactions: fire plus four more, drawn as line icons to match the rest of the app.
  var RK = ['fire', 'beast', 'lol', 'clown', 'dead'];
  var RL = { fire: 'Fire', beast: 'Beast', lol: 'LOL', clown: 'Clown', dead: 'Dead' };
  function rIcon(k) { return IC[k]; }

  // Last seen: green = had the app open in the last 5 minutes, yellow = in the last 30.
  function seenMin(pid) { var t = S && S.seen && S.seen[pid] ? Date.parse(S.seen[pid]) : NaN; return isNaN(t) ? Infinity : (Date.now() - t) / 60000; }
  function seenCls(pid) { if (!S || !S.me) return ''; if (pid === S.me.pid) return 'live'; var m = seenMin(pid); return m < 5 ? 'live' : m < 30 ? 'idle' : ''; }
  function seenTxt(pid) {
    if (S && S.me && pid === S.me.pid) return 'Active now';
    var m = seenMin(pid); if (m === Infinity) return 'Not active in the app yet';
    m = Math.floor(m);
    if (m < 1) return 'Active now';
    if (m < 60) return 'Last active ' + m + (m === 1 ? ' minute ago' : ' minutes ago');
    var h = Math.floor(m / 60); if (h < 24) return 'Last active ' + h + (h === 1 ? ' hour ago' : ' hours ago');
    var d = Math.floor(h / 24); return d < 7 ? 'Last active ' + d + (d === 1 ? ' day ago' : ' days ago') : 'Last active ' + new Date(S.seen[pid]).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // @mentions: names of people in the group are highlighted in comments.
  function mentionHTML(text) {
    var t = esc(text), names = (S && S.people || []).map(function (p) { return esc(p.name); }).filter(function (n) { return n; })
      .sort(function (a, b) { return b.length - a.length; }).map(function (n) { return n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
    if (!names.length) return t;
    return t.replace(new RegExp('(^|[^\\w@])@(' + names.join('|') + ')(?![\\w])', 'gi'), '$1<span class="men">@$2</span>');
  }

  // Light formatting for What's new messages: **bold**, "- " bullets, blank lines between paragraphs, links.
  function md(s) {
    function inline(x) { return esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
    return String(s || '').split(/\n\s*\n/).map(function (p) {
      var L = p.split('\n');
      return L.every(function (l) { return /^\s*- /.test(l); }) ? '<ul>' + L.map(function (l) { return '<li>' + inline(l.replace(/^\s*- /, '')) + '</li>'; }).join('') + '</ul>' : '<p>' + L.map(inline).join('<br>') + '</p>';
    }).join('');
  }

  function money(n) { var r = Math.round(n * 100) / 100, a = Math.abs(r); return (r < 0 ? '-' : '') + '$' + (a % 1 === 0 ? a : a.toFixed(2)); }
  var PALETTE = ['#2F6FEB', '#C2410C', '#0F8A5F', '#8B5CF6', '#B45309', '#0E7490', '#BE185D', '#4D7C0F', '#6D28D9', '#B91C1C', '#1D4ED8', '#047857'];
  function avatar(pid, large) {
    var n = 0, p = who(pid), name = p ? p.name : '?';
    for (var i = 0; i < pid.length; i++) n = (n * 31 + pid.charCodeAt(i)) % 997;
    var ini = (p && p.initials ? p.initials : name.substring(0, 2)).toUpperCase().substring(0, 3);
    var sc = seenCls(pid);
    return '<button class="av' + (large ? ' lg' : '') + (sc ? ' ' + sc : '') + '" style="background:' + PALETTE[n % PALETTE.length] + '" data-a="profile" data-id="' + esc(pid) + '" aria-label="' + esc(name) + ' profile">' + esc(ini) + '</button>';
  }
  function ago(ts) {
    var t = new Date(ts).getTime();
    if (isNaN(t)) return '';
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'now';
    if (m < 60) return m + 'm';
    if (m < 60 * 24) return Math.round(m / 60) + 'h';
    var d = Math.round(m / 1440);
    if (d === 1) return 'Yesterday';
    if (d < 7) return d + 'd';
    return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function nice(s) { s = String(s || '').replace(/[-_]/g, ' '); return s.charAt(0).toUpperCase() + s.slice(1); }
  function dayNum(iso) { var p = iso.split('-'); return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
  function dayLabel(iso) { var d = new Date(dayNum(iso) * 86400000); return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getUTCDay()] + ' ' + (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); }
  function cellOf(w, pid) { return w.cells.filter(function (x) { return x.pid === pid; })[0] || null; }
  function weekCount(pid) { var w = S.matrix[S.week.current - 1]; var c = w && cellOf(w, pid); return c ? c.count : 0; }
  function toast(msg, isErr, ms) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast' + (isErr ? ' err' : ''); t.style.display = 'block';
    clearTimeout(toast.timer); toast.timer = setTimeout(function () { t.style.display = 'none'; }, ms || (isErr ? 5000 : 3200));
  }
  function findItem(id) {
    var hit = S.feed.filter(function (x) { return x.id === id; });
    for (var pid in ui.profiles) hit = hit.concat((ui.profiles[pid].items || []).filter(function (x) { return x.id === id; }));
    return hit;
  }
  var IC = {
    fire: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 4.5 4.8 4.5 9a4.5 4.5 0 0 1-9 0c0-2.2 1-3.6 2.2-4.6 0 2 .8 3.1 2 3.4.2-3.1-.8-5.2.3-7.8z"/></svg>',
    msg: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>',
    trophy: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
    medal: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="15" r="5"/><path d="M9 10L6 3h4l2 4 2-4h4l-3 7"/></svg>',
    coin: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6.5v1.5M12 16v1.5"/></svg>',
    flag: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
    clock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>',
    feed: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/></svg>',
    grid: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></svg>',
    me: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
    beast: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>',
    lol: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M7.8 10.2c.7-.9 1.8-.9 2.5 0M13.7 10.2c.7-.9 1.8-.9 2.5 0M8 13.5h8a4 4 0 0 1-8 0z"/></svg>',
    clown: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="14.5" r="6.5"/><path d="M8.7 9L12 3.5 15.3 9"/><circle cx="12" cy="2.6" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="15" r="1.7" fill="currentColor" stroke="none"/><path d="M9.5 12.6h.01M14.5 12.6h.01M9.4 17.6c.8.6 1.7.9 2.6.9s1.8-.3 2.6-.9"/></svg>',
    dead: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a8 8 0 0 0-8 8c0 2.6 1.2 4.4 3 5.5V20a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-3.5c1.8-1.1 3-2.9 3-5.5a8 8 0 0 0-8-8z"/><circle cx="9" cy="11.5" r="1.6" fill="currentColor"/><circle cx="15" cy="11.5" r="1.6" fill="currentColor"/><path d="M10.5 21v-2.2M13.5 21v-2.2"/></svg>',
    cam: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8.5 6l1.5-2h4l1.5 2"/></svg>',
    react: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 12.8A8.6 8.6 0 1 1 11.2 3.4"/><path d="M8.5 14.5c.9 1.1 2 1.6 3.3 1.6s2.4-.5 3.3-1.6M9 9.8h.01M14.6 9.8h.01M18.5 2.5v6M15.5 5.5h6"/></svg>',
    back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>'
  };

  // ---------- server ----------
  function api(action, data, quiet, opts) {
    opts = opts || {};
    var body = { k: KEY, action: action };
    var t = top();
    if (t && t.t === 'profile' && action !== 'profile') body.profile = t.pid;
    for (var k in (data || {})) body[k] = data[k];
    // Only actions that change something lock the screen. A plain refresh never blocks taps.
    var lock = !quiet && !opts.noLock && action !== 'state', n = ++apiSeq, finished = false;
    function finish() { if (finished) return; finished = true; if (!quiet) setBusy(-1, lock); }
    if (!quiet) setBusy(1, lock);
    // Give up after 45 seconds (2 minutes for a WHOOP sync) so a stuck request can never leave the app frozen.
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); finish(); }, action === 'syncNow' ? 120000 : 45000);
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        clearTimeout(timer); finish();
        // Use the new data unless: an older answer arrived late, the save queue applies it itself (noState),
        // or saves are still waiting (a plain refresh would briefly undo them on screen).
        var keep = !!(j.ok && j.state && !opts.noState && n >= apiApplied && !(outbox.length && (action === 'state' || action === 'profile')));
        if (j.ok && j.state && !keep && !opts.noState) delete j.state;
        if (keep) apiApplied = n;
        if (!j.ok) {
          if (j.error === 'bad_key') { KEY = ''; lsSet('bcd_key', ''); renderKeyScreen('That code was not recognized.'); return null; }
          toast(j.error || 'Something went wrong.', true); return null;
        }
        if (keep) { S = j.state; lsSet('bcd_state', JSON.stringify(S)); }
        if (j.profile) ui.profiles[j.profile.pid] = j.profile;
        var news = (j.badgeNews || []).map(function (n) { return n.text || n.title || ''; });
        if (news.length) toast(news.join(' \u00b7 '), false, 6000);
        else if (j.message) toast(j.message);
        return j;
      })
      .catch(function () { clearTimeout(timer); var was = finished; finish(); if (!quiet && !was) toast('Could not reach the tracker. Check your connection.', true); else if (!quiet) toast('That took too long. Pull down to try again.', true); return null; });
  }
  var apiSeq = 0, apiApplied = 0, spinCount = 0, lockCount = 0;

  // ---------- instant saves ----------
  // Fires, reactions, comments, wall posts and workouts show on screen right away and are sent in the background,
  // one at a time and in order. Nothing locks the screen. When the last one is saved the app takes the fresh data.
  // If a save fails, the app says so and reloads from the tracker (a failed workout log reopens with what you typed).
  var outbox = [];
  function queue(action, data, onFail) { outbox.push({ action: action, data: data, onFail: onFail }); if (outbox.length === 1) sendNext(); }
  function sendNext() {
    var op = outbox[0]; if (!op) return;
    api(op.action, op.data, false, { noState: true, noLock: true }).then(function (j) {
      if (!j) {
        var failed = outbox.splice(0, outbox.length);
        failed.forEach(function (f) { if (f.onFail) f.onFail(); });
        api('state', {}, true).then(function (r) { if (r && r.state && !typing()) render(); });
        return;
      }
      outbox.shift();
      if (!outbox.length && j.state) { S = j.state; apiApplied = apiSeq; lsSet('bcd_state', JSON.stringify(S)); if (!typing()) render(); }
      sendNext();
    });
  }
  // ui.busy = something that changes data is in flight (taps are held). The buttons spin for any visible request.
  function setBusy(d, lock) {
    spinCount = Math.max(0, spinCount + d); if (lock) lockCount = Math.max(0, lockCount + d);
    ui.busy = lockCount > 0;
    document.getElementById('refreshBtn').className = 'pill' + (spinCount ? ' spin' : ''); document.getElementById('syncBtn').className = 'pill' + (spinCount ? ' spin' : '');
  }
  function typing() { var a = document.activeElement; return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')); }
  function refresh(quiet) {
    return api('state', {}, quiet).then(function (j) { if (j && j.state && !(typing() || (quiet && ui.stack.length))) render(); });
  }
  function done(j) { if (j) render(); }

  // ---------- feed cards ----------
  function renderKeyScreen(msg) {
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('fab').style.display = 'none';
    document.getElementById('hdrSub').textContent = 'Sign in';
    view.innerHTML = '<div class="card col" style="gap:14px"><h2 class="big">Enter your code</h2>' +
      '<p class="sub">Open the personal link you were texted, or paste the code from the end of it (the part after k=).</p>' +
      (msg ? '<p class="neg">' + esc(msg) + '</p>' : '') +
      '<input class="txt" id="keyInput" placeholder="Your code" autocapitalize="off" autocomplete="off">' +
      '<button class="btn" data-a="saveKey">Continue</button></div>';
  }
  // One comment: name, text (with @tags), when, an optional photo, and Delete for your own.
  function cmHTML(c, delA) {
    return '<div>' + nameBtn(c.pid) + (c.text ? ' <span style="color:var(--mid)">' + mentionHTML(c.text) + '</span>' : '') + '<span class="ct">' + (c.pending ? 'sending' : esc(ago(c.ts))) + '</span>' +
      (delA && c.pid === S.me.pid && !c.pending ? ' <button class="link" style="color:var(--dim);font-size:12px" data-a="' + delA + '" data-id="' + esc(c.id) + '">Delete</button>' : '') +
      ((c.photos || []).length ? '<div class="cph">' + c.photos.map(function (ph) { return '<button data-a="photoView" data-id="' + esc(ph.id) + '" aria-label="Open photo"><img src="' + esc(photoSrc(ph, 600)) + '" alt="" loading="lazy"></button>'; }).join('') + '</div>' : '') + '</div>';
  }
  function cmBox(id) {
    return '<div class="row"><input class="txt" id="c-' + esc(id) + '" placeholder="Comment, or @ someone" maxlength="500" aria-label="Add a comment">' +
      '<button class="pill" data-a="cPhoto" data-id="' + esc(id) + '" aria-label="Comment with a photo">' + IC.cam + '</button>' +
      '<button class="pill lime" data-a="sendC" data-id="' + esc(id) + '">Post</button></div>';
  }
  function actions(it) {
    if (it.pending) return '<div class="sub" style="margin-top:6px">Posting\u2026</div>';
    var n = it.comments.length, R = it.reacts || {}, h = '', picking = ui.pick === it.id;
    var given = RK.filter(function (k) { return (R[k] || []).length; });
    if (given.length) h += '<div class="col" style="gap:4px;margin-top:6px">' + given.map(function (k) { return '<div class="who">' + rIcon(k) + '<span>' + nameList(R[k]) + '</span></div>'; }).join('') + '</div>';
    function rx(k) {
      var L = R[k] || [], mine = L.indexOf(S.me.pid) !== -1;
      return '<button class="pill rx' + (mine ? ' lime' : '') + '" data-a="react" data-k="' + k + '" data-id="' + esc(it.id) + '" aria-pressed="' + mine + '" aria-label="' + RL[k] + '">' + rIcon(k) + '<span>' + L.length + '</span></button>';
    }
    h += '<div class="acts" style="margin-top:6px">' + given.map(rx).join('') +
      '<button class="pill rx' + (picking ? ' on' : '') + '" data-a="rpick" data-id="' + esc(it.id) + '" aria-label="Add a reaction" aria-expanded="' + picking + '">' + IC.react + '</button>' +
      '<button class="pill" data-a="toggleC" data-id="' + esc(it.id) + '">' + IC.msg + '<span>' + (n === 0 ? 'Comment' : n + (n === 1 ? ' comment' : ' comments')) + '</span></button>' +

  // ---------- sheets (full-screen pages) ----------
  function sheetWrap(title, body, footer) {
    return '<div class="sheet" role="dialog" aria-modal="true"><header><button class="x" data-a="closeSheet" aria-label="Back">' + IC.back + '</button><h2 style="font-size:19px">' + esc(title) + '</h2></header><div class="body" id="sheetBody">' + body + '</div>' + (footer ? '<footer>' + footer + '</footer>' : '') + '</div>';
  }
  function weekSheet(wk) {
    var w = S.matrix[wk - 1]; if (!w) return '';
    var ppl = S.people.filter(function (p) { return p.active; });
    var h = '<div class="tw"><table><thead><tr><th>Day</th>' + ppl.map(function (p) { return '<th>' + esc(p.name) + '</th>'; }).join('') + '</tr></thead><tbody>';
    var start = dayNum(w.start), today = dayNum(S.week.today);
    for (var i = 0; i < 7; i++) {
      var iso = new Date((start + i) * 86400000).toISOString().substring(0, 10);
      h += '<tr><td>' + dayLabel(iso) + '</td>';
      ppl.forEach(function (p) {
        var hit = S.credits[p.pid] && S.credits[p.pid][iso];
        var cell = cellOf(w, p.pid) || {};
        var off = cell.status === 'exempt';
        h += '<td' + (off ? ' class="exempt"' : '') + ' title="' + esc(hit ? hit.join(', ') : '') + '">' + (hit ? '<b class="pos">\u2713</b>' : (start + i > today || off ? '' : '<span class="neg">\u2715</span>')) + '</td>';
      });
      h += '</tr>';
    }
    h += '</tbody></table></div>';
    h += '<div class="card col"><span class="sub">In the money</span><div>' + (w.inMoney.length ? nameList(w.inMoney) : (w.isCurrent ? 'Nobody yet' : 'Nobody')) + '</div></div>';
    h += '<div class="card col"><span class="sub">Buying the bet</span><div>' + (w.buying.map(function (b) { return nameBtn(b.pid, ' (' + money(b.amount) + ')'); }).join(', ') || 'Nobody') + '</div></div>';
    return sheetWrap(w.label, h, '');
  }

    var ok = L.minutes >= S.rules.minTime;

      body += '<div class="col" style="gap:10px"><span class="lab">Day</span>' + opts('date', days.map(function (d) { return { id: d.iso, label: d.today ? 'Today' : d.label }; })) +
        (S.me.admin ? '<div class="row"><button class="opt' + (L.earlier ? ' on' : '') + '" data-a="logEarlier">Earlier day</button>' + (L.earlier ? '<input type="date" class="txt" id="logDate" max="' + esc(S.week.today) + '" value="' + esc(L.dateX || '') + '" style="flex:1">' : '') + '</div>' : '') + '</div>';
      if (dup.length) {
        var d0 = dup[0], isW = d0.source === 'whoop';
        body += '<div class="banner">You already have a ' + (isW ? 'WHOOP ' : (d0.source === 'sms' ? 'texted ' : 'logged ')) + esc(nice(d0.activity || 'workout').toLowerCase()) + ' on ' + esc(dayLabel(L.date)) + '. ' +
          (isW && d0.ok ? 'A second log for that day will be hidden in the feed, because WHOOP already covers it. ' : 'It only counts once toward your week. ') +
          '<button class="link" data-a="viewPost" data-id="' + esc(d0.id) + '">View it</button></div>';

    }
    body += '<div class="col" style="gap:10px"><span class="lab">What did you do?</span>' + opts('type', TYPES) + '</div>' +
      '<div class="col" style="gap:10px"><span class="lab">How long?</span><div class="card row between" style="padding:10px"><button class="step" data-a="mins" data-id="-5" aria-label="5 minutes less">-</button><div><b style="font-size:34px">' + L.minutes + '</b> <span class="sub">min</span></div><button class="step" data-a="mins" data-id="5" aria-label="5 minutes more">+</button></div>' +
      '<span style="font-size:13px" class="' + (ok ? 'pos' : 'neg') + '">' + (ok ? 'Counts toward your week' : 'Needs ' + S.rules.minTime + ' min to count') + '</span></div>' +
      '<div class="col" style="gap:10px"><span class="lab">Effort</span>' + opts('effort', ['Easy', 'Moderate', 'Hard']) + '</div>' + noteBox;
    return sheetWrap(editing ? 'Edit workout' : 'Log a workout', body, '<button class="btn" data-a="submitLog">' + (editing ? 'Save changes' : (dup.length ? 'Post anyway' : 'Post to the feed')) + '</button>');
  }

  function badgeIcon(b) { return b.kind === 'title' || b.kind === 'weekly' ? IC.trophy : IC.medal; }
  function holds(b, pid) { return b.holders.filter(function (x) { return x.pid === pid; })[0] || null; }
  function profileSheet(pid) {
    var p = who(pid); if (!p) return sheetWrap('Profile', '<div class="empty">Not found.</div>', '');
    var st = (S.stats || {})[pid] || { total: 0, complete: 0, played: 0, streak: 0, longest: 0, fines: 0 };
    var acct = S.bank.accounts.filter(function (a) { return a.pid === pid; })[0];
    var bal = acct ? acct.balance : 0;
    var wLabel = { connected: 'WHOOP connected', reconnect: 'WHOOP disconnected', none: 'No WHOOP' }[p.whoop] || '';
    var h = '<section class="card row">' + avatar(pid, true) + '<div class="col grow" style="gap:1px"><b style="font-size:20px">' + esc(p.name) + (pid === S.me.pid ? ' (you)' : '') + '</b><span class="sub">' + esc(wLabel) + '</span>' + '<span class="sub seen"><i class="' + seenCls(pid) + '"></i>' + esc(seenTxt(pid)) + '</span>' + '</div>' +
      '<div class="col" style="align-items:flex-end;gap:0"><span class="sub">Balance</span><b class="num ' + (bal < 0 ? 'neg' : (bal > 0 ? 'pos' : '')) + '" style="font-size:20px">' + money(bal) + '</b></div></section>';

    h += '<div class="stats"><div class="stat"><span>Workouts</span><b>' + st.total + '</b></div><div class="stat"><span>Weeks made</span><b>' + st.complete + '/' + st.played + '</b></div><div class="stat"><span>Fines</span><b class="' + (st.fines ? 'neg' : '') + '">' + money(st.fines) + '</b></div>' +
      '<div class="stat"><span>Streak</span><b>' + st.streak + ' wk</b></div><div class="stat"><span>Best streak</span><b>' + st.longest + ' wk</b></div><div class="stat"><span>This week</span><b>' + weekCount(pid) + '/' + S.rules.minDays + '</b></div></div>';

    h += '<div class="col" style="gap:8px"><span class="lab">Season, week by week</span><div class="strip">' + S.matrix.map(function (w) {
      var c = cellOf(w, pid) || { status: '' };
      return '<span class="sq ' + c.status + '" title="' + esc(w.label + ': ' + (ST_LABEL[c.status] || '')) + '">' + w.week + '</span>';
    }).join('') + '</div></div>';

    // challenges
    var ch = S.challenges, lines = [];
    var sIdx = -1; ch.strain.season.forEach(function (r, i) { if (r.pid === pid) sIdx = i; });
    if ((ch.strain.members || []).indexOf(pid) !== -1) {
      var tw = ch.strain.thisWeek.filter(function (r) { return r.pid === pid; })[0];
      lines.push('<div><span class="grow"><b>Weekly Strain</b><br><span class="sub">' + (sIdx >= 0 ? 'Season ' + ch.strain.season[sIdx].total.toFixed(1) + '   #' + (sIdx + 1) + ' of ' + ch.strain.season.length : 'No strain recorded yet') + '</span></span><b class="num pos">' + (tw ? tw.total.toFixed(1) : '0.0') + '</b></div>');
    }
    if ((ch.weight.members || []).indexOf(pid) !== -1) {
      var wr = ch.weight.board.filter(function (r) { return r.pid === pid; })[0];
      lines.push('<div><span class="grow"><b>Weight</b><br><span class="sub">' + (wr ? wr.weighIns + (wr.weighIns === 1 ? ' weigh-in' : ' weigh-ins') : 'No weigh-ins yet') + '</span></span><b class="num pos">' + (wr ? (wr.pct > 0 ? '+' : '') + wr.pct.toFixed(1) + '%' : '--') + '</b></div>');
    }
    h += '<div class="col" style="gap:8px"><span class="lab">Challenges</span>' + (lines.length ? '<div class="list">' + lines.join('') + '</div>' : '<p class="sub">Not in any challenges yet.</p>') + '</div>';

    // badges
    var badges = S.badges || [];
    var earned = badges.filter(function (b) { return holds(b, pid); }).length;
    h += '<div class="col" style="gap:8px"><span class="lab">Badges   ' + earned + ' of ' + badges.length + '</span><div class="bgrid">' + badges.map(function (b) {
      var got = !!holds(b, pid);
      return '<button class="bdg' + (got ? ' got ' + b.kind : '') + '" data-a="badge" data-id="' + esc(b.id) + '" data-pid="' + esc(pid) + '" aria-label="' + esc(b.name + (got ? ', earned' : ', not earned')) + '">' + badgeIcon(b) + '<span>' + esc(b.name) + '</span></button>';
    }).join('') + '</div></div>';

    // wall + feed
    var P = ui.profiles[pid];
    h += '<div class="col" style="gap:10px"><span class="lab">Wall</span><div class="row"><input class="txt" id="wallInput" maxlength="500" placeholder="Write on ' + esc(p.name) + '\'s wall" aria-label="Write on the wall"><button class="pill lime" data-a="wallPost" data-id="' + esc(pid) + '">Post</button></div>';
    if (P && P.wall.length) {
      h += '<div class="list">' + P.wall.map(function (c) {
        return '<div style="align-items:flex-start"><span class="grow">' + nameBtn(c.pid) + ' <span style="color:var(--mid)">' + mentionHTML(c.text) + '</span><span class="ct">' + (c.pending ? 'sending' : esc(ago(c.ts))) + '</span></span>' + (c.mine ? '<button class="link" style="color:var(--dim)" data-a="wallDel" data-id="' + esc(c.id) + '">Delete</button>' : '') + '</div>';
      }).join('') + '</div>';
    } else if (P) h += '<p class="sub">Nothing on the wall yet.</p>';
    h += '</div>';

    h += '<span class="lab">Posts</span>';
    if (!P) h += '<div class="empty">Loading posts...</div>';
    else if (!P.items.length) h += '<div class="empty">No posts yet.</div>';
    else h += cards(P.items);
    return sheetWrap(p.name, h, '');
  }
  function badgeSheet(id, pid) {
    var b = (S.badges || []).filter(function (x) { return x.id === id; })[0];
    if (!b) return sheetWrap('Badge', '<div class="empty">Not found.</div>', '');
    var mine = pid ? holds(b, pid) : null;
    var h = '<section class="card col" style="gap:10px;align-items:center;text-align:center"><span class="bdg got ' + b.kind + '" style="width:96px">' + badgeIcon(b) + '</span><b style="font-size:20px">' + esc(b.name) + '</b>' +
      '<span class="tag">' + (b.kind === 'title' ? 'TITLE   CHANGES HANDS' : b.kind === 'weekly' ? 'WEEKLY   HELD FOR ONE WEEK' : 'MILESTONE') + '</span><p style="color:var(--mid)">' + esc(b.desc) + '</p>' +

    h += '<span class="lab">' + (b.kind === 'milestone' ? 'Who has it' : 'Current holder') + '   ' + b.holders.length + '</span>';

            (b.kind === 'milestone' ? '<div class="pbar"><i style="width:' + Math.round(r.pct * 100) + '%"></i></div>' : '') + '</div><span class="sub" style="text-align:right;max-width:46%">' + esc(r.detail) + '</span></div>';
        }).join('') + '</div></div>';
    }
    // History: every time it was earned or changed hands, with comments and photos under each.

      var n = (e.comments || []).length, open = !!ui.open[e.id];
      return '<div style="flex-direction:column;align-items:stretch;gap:6px"><div class="row" style="gap:10px;align-items:flex-start"><span class="ic" style="flex:none;color:' + (e.type === 'badge_loss' ? 'var(--red)' : 'var(--lime)') + '">' + IC.medal + '</span>' +
        '<div class="col grow" style="gap:2px"><b>' + esc(e.title) + '</b><span class="sub">' + esc(e.body) + '</span><span class="sub" style="font-size:12px">' + esc(ago(e.ts)) + '</span></div></div>' +
        '<div class="acts"><button class="pill" data-a="toggleC" data-id="' + esc(e.id) + '">' + IC.msg + '<span>' + (n ? n + (n === 1 ? ' comment' : ' comments') : 'Comment') + '</span></button></div>' +
        (open ? '<div class="cm">' + (e.comments || []).map(function (c) { return cmHTML(c, 'cDel'); }).join('') + cmBox(e.id) + '</div>' : '') + '</div>';
    }).join('') + '</div>' : '<p class="sub">Nothing yet. When this changes hands it shows up here, and everyone can comment or add a photo.</p>') + '</div>';

  function renderSheet() {
    var el = document.getElementById('sheet');
    var t = top();
    if (!t) { el.innerHTML = ''; return; }
    var keep = document.getElementById('logNote'); if (keep && t.t === 'log') ui.log.note = keep.value;
    var fbk = document.getElementById('fbText'); if (fbk && t.t === 'feedback') ui.fb = fbk.value;
    var npn = document.getElementById('npName'); if (npn && t.t === 'newpot' && ui.npot) { ui.npot.name = npn.value; ui.npot.description = (document.getElementById('npDesc') || {}).value; ui.npot.entry = (document.getElementById('npEntry') || {}).value; }
    var ncn = document.getElementById('ncName'); if (ncn && t.t === 'newchal' && ui.nc) { ui.nc.name = ncn.value; ui.nc.rules = (document.getElementById('ncRules') || {}).value; ui.nc.weeks = (document.getElementById('ncWeeks') || {}).value; ui.nc.fine = (document.getElementById('ncFine') || {}).value; ui.nc.start = (document.getElementById('ncStart') || {}).value; }
    var ept = document.getElementById('epText'); if (ept && t.t === 'editpost' && ui.ep) ui.ep.text = ept.value;
    var dpa = document.getElementById('depAmt'); if (dpa && t.t === 'deposit' && ui.dep) ui.dep.amount = dpa.value;
    var pst = document.getElementById('postText'); if (pst && t.t === 'post' && ui.post) ui.post.text = pst.value;
    if (t.t === 'bet') grabBet();

    adminSettings: function () { ui.adm2 = null; pushSheet({ t: 'settings' }); admLoad(); },
    admRules: function () {
      var keys = ['min_days', 'min_time', 'min_effort', 'bet_per_miss'], i = 0;
      (function next() { if (i >= keys.length) { toast('Rules saved.'); admLoad(); refresh(true); return; } var k = keys[i++]; api('adminSet', { key: k, value: val('rule-' + k) }, true).then(function (j) { if (j) next(); else admLoad(); }); })();
    },
    admVenmo: function () { api('adminSet', { key: 'venmo_user', value: val('rule-venmo_user') }, true).then(function (j) { if (j) { admLoad(); refresh(true); } }); },
    admWoWho: function (id) { ui.wo = id; renderSheet(); },
    admWeek: function (id) {
      var A = ui.adm2, tgt = ui.wo || 'all', P = A.people.filter(function (x) { return x.pid === tgt; })[0], w = parseInt(id, 10);
      var off = (tgt === 'all' ? A.offAll : (P ? P.off : [])).slice(), i = off.indexOf(w); if (i === -1) off.push(w); else off.splice(i, 1); off.sort(function (a, b) { return a - b; });
      if (tgt === 'all') A.offAll = off; else if (P) P.off = off;
      renderSheet(); api('adminWeeksOff', { pid: tgt, weeks: off.join(',') }, true).then(function (j) { if (j) refresh(true); else admLoad(); });
    },
    admActive: function (id) {
      var P = ui.adm2.people.filter(function (x) { return x.pid === id; })[0]; if (!P) return;
      if (P.active ? !confirm('Take ' + P.name + ' out of the whole season, past weeks included? Their past fines, pot wins and payments stop showing too. To skip just some weeks, use Weeks off instead.')
          : !confirm('Put ' + P.name + ' back in? Any weeks they were out will count as missed (with fines) unless you mark them under Weeks off.')) return;
      api('adminPersonSet', { pid: id, active: P.active ? '' : '1' }, true).then(function (j) { admLoad(); if (j) refresh(true); });
    },
    admPerson: function (id) {
      var P = ui.adm2.people.filter(function (x) { return x.pid === id; })[0]; if (!P) return;
      var nm = prompt('Name', P.name); if (nm === null) return;
      var ph = prompt('Phone number (texted workouts are matched by this)', P.phone || ''); if (ph === null) return;
      api('adminPersonSet', { pid: id, name: nm, phone: ph }, true).then(function (j) { admLoad(); if (j) refresh(true); });
    },
    admAdd: function () {
      var nm = val('admName'); if (nm.length < 2) { toast('Enter a name.', true); return; }
      api('adminPersonAdd', { name: nm, phone: val('admPhone') }, true).then(function (j) { admLoad(); if (j) refresh(true); });
    },

    potCDel: function (id) {
      if (!confirm('Delete this comment?')) return;
      ((S.bank && S.bank.pots) || []).concat((S.bank && S.bank.customPots) || []).forEach(function (p) { p.comments = (p.comments || []).filter(function (c) { return c.id !== id; }); });
      render(); queue('deleteComment', { id: id });
    },
    betsDone: function () { pushSheet({ t: 'betsDone' }); },
    admin: function () {
      ui.adm = null; pushSheet({ t: 'admin' });
      api('adminUsage', {}, true).then(function (j) {
        if (!j) { toast('Could not load the admin data.', true); return; }
        ui.adm = { usage: j.usage || [], feedback: j.feedback || [] }; renderSheet();
      });
    },
    adminUsage: function () { pushSheet({ t: 'usage' }); },
    adminFeedback: function () { pushSheet({ t: 'fbInbox' }); },
    betNew: function () { ui.bet = freshBet(); pushSheet({ t: 'bet' }); },
    bset: function (id, el) {
      grabBet(); var D = ui.bet, k = el.getAttribute('data-k');
      D[k] = id;
      if (k === 'type') { D.side = 'a'; D.close = id === 'custom' ? '1440' : '180'; if (id !== 'h2h') { D.B = []; D.A = D.A.slice(0, 1); } if (id === 'yn') D.stat = 'workouts'; }
      if (D.type === 'yn' && (D.q === 'week' || D.q === 'dormie') && D.period !== 'week' && D.period !== 'nextweek') D.period = 'week';
      if (D.close === 'start' && D.period !== 'nextweek') D.close = 'end';
      renderSheet();
    },
    bone: function (id, el) { grabBet(); ui.bet[el.getAttribute('data-k')] = [id]; renderSheet(); },
    btog: function (id, el) { grabBet(); var a = ui.bet[el.getAttribute('data-k')], i = a.indexOf(id); if (i === -1) a.push(id); else a.splice(i, 1); renderSheet(); },
    bteam: function (id) { grabBet(); var D = ui.bet; D.team = id === 'team'; if (!D.team) { D.A = D.A.slice(0, 1); D.B = D.B.slice(0, 1); } renderSheet(); },
    bhide: function () { grabBet(); ui.bet.hide = !ui.bet.hide; renderSheet(); },
    bn: function (id) { grabBet(); ui.bet.n = Math.max(1, Math.min(30, ui.bet.n + parseInt(id, 10))); renderSheet(); },
    betPhoto: function () {
      grabBet();
      var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.hidden = true;
      inp.onchange = function () { var f = inp.files && inp.files[0]; inp.remove(); if (!f) return; shrinkPhoto(f).then(function (d) { if (ui.bet) { grabBet(); ui.bet.photo = d; renderSheet(); } }).catch(function (e) { toast(e.message, true); }); };
      document.body.appendChild(inp); inp.click();
    },
    betPhotoX: function () { grabBet(); if (ui.bet) ui.bet.photo = ''; renderSheet(); },
    betPost: function () {
      grabBet(); var D = ui.bet;
      var req = { type: D.type, side: D.side, amount: parseFloat(D.amount) };
      if (!req.amount || req.amount < 1) { toast('Enter your bet (at least $1).', true); return; }
      if (D.close === 'pick') { var dt = new Date(D.closeAt); if (!D.closeAt || isNaN(dt.getTime())) { toast('Pick when betting closes.', true); return; } req.closeAt = dt.toISOString(); }
      else if (D.close === 'start' || D.close === 'end') req.closeMode = D.close; else req.closeMinutes = parseInt(D.close, 10);
      if (D.type === 'custom') { req.prompt = D.prompt; req.labelA = D.labelA; req.labelB = D.labelB; req.hiddenFrom = D.hiddenFrom; }
      else {
        req.subjA = D.A; req.subjB = D.B; req.stat = D.stat; req.line = parseFloat(D.line); req.q = D.q; req.n = D.n; req.scoring = D.scoring; req.period = D.period; req.hide = D.hide;
        if (!D.A.length) { toast('Pick who the bet is about.', true); return; }
        if (D.type === 'ou' && isNaN(req.line)) { toast('Enter the over/under number.', true); return; }
      }
      var bid = 'sb_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36), pic = D.photo || '';
      req.id = bid;
      api('betPropose', req).then(function (j) { if (!j) return; if (pic) queue('photoAdd', { target: bid, data: pic }); ui.bet = null; closeAll(); ui.tab = 'challenges'; render(); view.scrollTop = 0; });
    },
    betOpen: function (id) { var t = top(); if (t && t.t === 'betd' && t.id === id) return; ui.betPick = null; pushSheet({ t: 'betd', id: id }); },
    betPick: function (id, el) { ui.betPick = { id: id, side: el.getAttribute('data-k'), amount: ui.betPick && ui.betPick.id === id ? val('betAmt') : '' }; renderSheet(); var f = document.getElementById('betAmt'); if (f) f.focus(); },
    betCancel: function () { ui.betPick = null; renderSheet(); },
    betPlace: function (id) {
      var bt = betOf(id), pk = ui.betPick; if (!bt || !pk) return;
      var amt = parseFloat(val('betAmt'));
      if (!amt || isNaN(amt) || amt < 1) { toast('Enter your bet (at least $1).', true); return; }
      if (!confirm('Put ' + money(amt) + ' on "' + (pk.side === 'a' ? bt.labelA : bt.labelB) + '"? You cannot change it afterward.')) return;
      api('betPlace', { id: id, side: pk.side, amount: amt }).then(function (j) { if (j) { ui.betPick = null; render(); } });
    },
    betResolve: function (id, el) {
      var bt = betOf(id), w = el.getAttribute('data-k'); if (!bt) return;
      var q = w === 'void' ? 'Call this bet off? Everyone gets their money back.' : 'Close the bet with "' + (w === 'a' ? bt.labelA : bt.labelB) + '" as the winner? This pays out right away.';
      if (!confirm(q)) return;
      api('betResolve', { id: id, winner: w }).then(done);
    },
    join: function (id) { api('join', { challenge: id }).then(done); },
    leave: function (id) { if (!confirm('Leave this challenge?')) return; api('leave', { challenge: id }).then(done); },
    weight: function () { var v = parseFloat(val('wt')); if (isNaN(v)) { toast('Enter your weight.', true); return; } api('weight', { weight: v }).then(done); },
    hidePost: function (id) {
      var m = S.me; m.hidden = (m.hidden || []).concat(id); render();
      api('hidePost', { id: id }, true); toast('Hidden from your feed.');
    },
    unhidePosts: function () { S.me.hidden = []; render(); api('unhidePosts', { clear: '1' }, true); },
    adminDel: function (id) {
      if (!confirm('Delete this post for everyone? This cannot be undone.')) return;
      api('adminDelete', { id: id }).then(done);
    },
    pushOn: function (id, el) {
      el.disabled = true;
      Notification.requestPermission().then(function (perm) {
        if (perm !== 'granted') throw new Error('Notifications were not allowed.');
        return fbToken();
      }).then(function (t) {
        lsSet('bcd_pushTok', t); lsSet('bcd_pushOn', '1');
        return api('pushToken', { token: t }, true);
      }).then(function (j) { if (j) { S.me.push = S.me.push || { off: [], cats: {} }; S.me.push.phones = Math.max(1, S.me.push.phones || 0); toast('Notifications are on for this phone.'); } else lsSet('bcd_pushOn', ''); })
        .catch(function (e) { toast(e.message || 'Could not turn on notifications.', true); })
        .then(function () { el.disabled = false; if (!typing()) render(); });
    },
    pushOff: function () {
      var t = lsGet('bcd_pushTok'); lsSet('bcd_pushOn', '');
      try { if (self.firebase && firebase.apps.length) firebase.messaging().deleteToken(); } catch (e) {}
      render(); if (t) api('pushToken', { token: t, remove: '1' }, true).then(function (j) { if (j) toast('Notifications are off for this phone.'); });
    },
    pushCat: function (id) {
      var P = S.me.push; if (!P) return;
      var off = (P.off || []).slice(), i = off.indexOf(id); if (i === -1) off.push(id); else off.splice(i, 1);
      P.off = off; render(); api('pushPrefs', { off: off.join(',') }, true);
    },
    pushTest: function () { api('pushTest', {}, true).then(function (j) { if (j && j.message) toast(j.message); }); },
    feedback: function () { ui.fb = ''; pushSheet({ t: 'feedback' }); },
    feedbackSend: function () {
      var t = val('fbText'); if (!t) { toast('Write something first.', true); return; }
      ui.fb = t;
      api('feedback', { text: t }).then(function (j) { if (j) { ui.fb = ''; ACT.closeSheet(); } });
    },
    stravaOn: function () { if (S.me.connectUrl) window.open(S.me.connectUrl + '&svc=strava', '_blank'); else toast('Strava connect is not set up yet.', true); },
    stravaOff: function () { if (!confirm('Disconnect Strava? Workouts already posted stay.')) return; api('stravaOff', {}).then(function (j) { if (j) { S.me.strava = 'none'; render(); } }); },
    connect: function () { if (S.me.connectUrl) window.open(S.me.connectUrl, '_blank'); else toast('WHOOP connect is not set up yet.', true); }
  };
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-a]') : null;
    if (!el || ui.busy && el.getAttribute('data-a') !== 'closeSheet') return;
    var fn = ACT[el.getAttribute('data-a')];
    if (fn) fn(el.getAttribute('data-id'), el);
  });

  // Typing "@" in a comment or wall post shows the group's names; tapping one fills it in.
  var mentionEl = null;
  function mentionBox(el) {
    var row = el.closest('.row') || el, nx = row.nextElementSibling, box = nx && nx.classList.contains('msugg') ? nx : null;
    var m = el.value.slice(0, el.selectionStart || 0).match(/(^|\s)@([^@\s]*)$/), q = m ? m[2].toLowerCase() : null;
    var names = q === null ? [] : (S.people || []).filter(function (p) { return p.active && p.pid !== S.me.pid && p.name.toLowerCase().indexOf(q) === 0; }).map(function (p) { return p.name; }).slice(0, 8);
    if (!names.length) { if (box) box.remove(); return; }
    if (!box) { box = document.createElement('div'); box.className = 'msugg'; row.parentNode.insertBefore(box, row.nextSibling); }
    box.innerHTML = names.map(function (n) { return '<button type="button" class="pill" data-a="mentionPick" data-id="' + esc(n) + '">@' + esc(n) + '</button>'; }).join('');
    mentionEl = el;
  }
  document.addEventListener('input', function (e) { var el = e.target; if (el && el.id && (el.id === 'wallInput' || el.id === 'postText' || el.id.indexOf('c-') === 0)) mentionBox(el); });
  // Keep the keyboard up while tapping a name.
  document.addEventListener('mousedown', function (e) { if (e.target.closest && e.target.closest('.msugg')) e.preventDefault(); });

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (!el || el.id !== 'betAmt') return;
    var bt = betOf(el.getAttribute('data-bet')), out = document.getElementById('betPay');
    if (ui.betPick) ui.betPick.amount = el.value;
    if (bt && out) out.textContent = payText(bt, el.getAttribute('data-k'), parseFloat(el.value));
  });

  // ---------- swipe a feed card left to Hide (and Delete, for the admin) ----------
  (function () {
    var x0 = null, y0 = 0, el = null, card = null, W = 0, base = 0, moved = false, open = null;
    function shut(w) { setX(w.querySelector('.swc'), 0, true); w.classList.remove('open'); setTimeout(function () { if (!w.classList.contains('open')) w.classList.remove('drag'); }, 220); }
    function setX(c, x, anim) { c.style.transition = anim ? 'transform .2s ease-out' : 'none'; c.style.transform = x ? 'translateX(' + x + 'px)' : ''; }
    document.addEventListener('touchstart', function (e) {
      var t = e.target.closest ? e.target.closest('.swp') : null;
      if (open && open !== t) { shut(open); open = null; }
      el = t; x0 = null; moved = false; if (!el || e.touches.length !== 1) { el = null; return; }
      card = el.querySelector('.swc'); W = el.querySelector('.swa').offsetWidth; base = open === el ? -W : 0;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchmove', function (e) {
      if (!el || x0 === null) return;
      var dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
      if (!moved && Math.abs(dy) > 12 && Math.abs(dx) < Math.abs(dy)) { el = null; return; }
      if (Math.abs(dx) > 10 && !moved) { moved = true; el.classList.add('drag'); }
      if (moved) setX(card, Math.max(-W, Math.min(0, base + dx)), false);
    }, { passive: true });
    document.addEventListener('touchend', function (e) {
      if (!el || x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0, was = el; x0 = null;
      if (!moved) return;
      var openIt = base + dx < -W / 2;
      if (openIt) { setX(card, -W, true); was.classList.add('open'); open = was; } else { shut(was); open = null; }
      var stop = function (ev) { if (ev.target.closest && ev.target.closest('.swa')) return; ev.stopPropagation(); ev.preventDefault(); };
      document.addEventListener('click', stop, { capture: true, once: true }); setTimeout(function () { document.removeEventListener('click', stop, { capture: true }); }, 400);
    });
  })();

  // ---------- pull down to refresh ----------
  // Home-screen apps on iPhone have no built-in pull to refresh, so this does it by hand.
  // Pulling reloads from the sheet (fast). The Sync button is what asks WHOOP for new workouts.
  (function () {
    var ptr = document.getElementById('ptr'), y0 = null, pull = 0, MAX = 120, GO = 64;
    function scroller() { return ui.stack.length ? document.getElementById('sheetBody') : null; }
    function atTop() { var sc = scroller(); return (sc || view).scrollTop <= 0; }
    function show(px, anim) { ptr.style.transition = anim ? 'transform .2s, opacity .2s' : 'none'; ptr.style.opacity = px > 6 ? Math.min(1, px / GO) : 0; ptr.style.transform = 'translateY(' + (px - 60) + 'px) rotate(' + (px * 3) + 'deg)'; }
    document.addEventListener('touchstart', function (e) {
      y0 = null; pull = 0;
      if (!KEY || !S || ui.busy || e.touches.length !== 1 || !atTop()) return;
      var t = top(); if (t && (t.t === 'log' || t.t === 'bet' || t.t === 'feedback' || t.t === 'post')) return;
      y0 = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchmove', function (e) {
      if (y0 === null) return;
      var d = e.touches[0].clientY - y0;
      if (d <= 0 || !atTop()) { pull = 0; show(0); if (d < -10) y0 = null; return; }
      pull = Math.min(MAX, d * 0.5); show(pull);
    }, { passive: true });
    function end() {
      if (y0 === null) return;
      y0 = null;
      if (pull < GO) { show(0, true); return; }
      show(GO, true); ptr.className = 'go';
      var t = top();
      var p = t && t.t === 'profile' ? api('profile', { pid: t.pid }, true).then(function () { return api('state', {}, true); }) : api('state', {}, true);
      p.then(function (j) {
        ptr.className = ''; show(0, true);
        if (!j) { toast('Could not reach the tracker. Check your connection.', true); return; }
        if (!typing()) render();
      });
    }
    document.addEventListener('touchend', end); document.addEventListener('touchcancel', end);
  })();

  // ---------- start ----------
  function start() {
    if (!KEY) { renderKeyScreen(''); return; }
    var cached = lsGet('bcd_state');
    if (cached && !S) { try { S = JSON.parse(cached); if (!S.badges || !S.stats || !S.bets || !S.bank.openBets || (S.bets[0] && !S.bets[0].pairs)) S = null; else render(); } catch (e) { S = null; } }
    refresh(false).then(function () { showNews(); pushRefresh(); });
  }
  // ---------- getting new versions onto the phone quickly ----------
  // A home-screen app can sit in the background for days without reloading. So: check for a new version whenever the app
  // comes back to the front (and every 30 minutes while open). When a new version has installed, reload once, waiting
  // until no page is open, nothing is being typed and nothing is still saving, so nothing you're doing gets lost.
  (function () {
    if (!('serviceWorker' in navigator)) return;
    var hadSW = !!navigator.serviceWorker.controller, reg = null, wait = 0, last = 0;
    function check() { if (!reg || Date.now() - last < 60000) return; last = Date.now(); reg.update().catch(function () {}); }
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadSW || wait) return;                 // first install: nothing to refresh
      function go() {
        if (ui.stack.length || ui.busy || spinCount || outbox.length || typing()) return;
        clearInterval(wait); toast('Updating to the new version\u2026'); setTimeout(function () { location.reload(); }, 600);
      }
      wait = setInterval(go, 1500); go();
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    setInterval(function () { if (!document.hidden) check(); }, 30 * 60000);
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (r) { reg = r; }).catch(function () {});
    });
  })();

  document.addEventListener('visibilitychange', function () { if (!document.hidden && KEY && S) refresh(true); });
  setInterval(function () { if (!document.hidden && KEY && S && !ui.busy) refresh(true); }, 90000);
  start();
})();
